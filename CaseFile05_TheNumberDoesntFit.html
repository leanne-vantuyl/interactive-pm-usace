var KC_QUESTIONS=[
  {tag:'Doctrine',text:'A PROC2040 Resource Estimate that comes in above the funding ceiling set under PROC1040 most accurately indicates:',
   options:['The PDT made an error that must be corrected before proceeding','The project must be cancelled','New information that needs to be understood and addressed \u2014 not automatically a crisis','The ceiling was set incorrectly and should be ignored'],
   correct:2,
   explain:'Ceilings are often set before design is complete. A refined estimate landing above the ceiling is information \u2014 about scope, market conditions, or corrected assumptions \u2014 that the PDT needs to understand and address, not evidence of an error or a reason to ignore the ceiling.'},
  {tag:'Doctrine',text:'Per REF8007G, contingency in the Resource Estimate is best understood as:',
   options:['A flexible buffer that can be resized whenever convenient','Funds set aside for scope additions requested by the sponsor','An estimate of the PM\u2019s personal judgment about uncertainty','An amount sized to specific risks documented in the Risk Register'],
   correct:3,
   explain:'Contingency under REF8007G is tied to specific identified risks in the Risk Register \u2014 it is not a generic cushion. Changing it without examining the underlying risk basis changes what risks the project is actually protected against, whether or not that is explicitly acknowledged.'},
  {tag:'People Skill',text:'Bringing a funding gap to leadership already framed with realistic options, rather than just stating the gap, primarily helps because:',
   options:['It guarantees leadership will approve the preferred option','It removes the need for leadership to make any decision','It shifts the conversation from "what even is this problem" to "which path forward makes sense"','It means the PM does not need to mention the size of the gap'],
   correct:2,
   explain:'Framing with real options does not predetermine the outcome \u2014 leadership still decides. But it changes where the conversation starts: instead of leadership absorbing a raw problem and then asking "what are our options," they encounter the problem and the options together.'},
  {tag:'Judgment',text:'A DPM responds to a funding gap with "find a way to make it work within the ceiling." What should the project manager do next?',
   options:['Refuse outright, since the ceiling cannot accommodate the estimate','Comply immediately without discussing what "making it work" would actually require','Agree to make it work, then quietly decide later how to handle any consequences','Acknowledge the constraint while being precise about what meeting it would require \u2014 including any risk tradeoffs'],
   correct:3,
   explain:'Neither blanket refusal nor silent compliance serves the DPM well. Being precise about what "making it work" actually requires \u2014 e.g., a contingency reduction below the risk-based amount \u2014 gives the DPM real information to make an informed decision, which may also support raising the issue further up the chain if needed.'},
  {tag:'Judgment',text:'A PM quietly reduces contingency to close a funding gap without documenting the change in risk exposure. The most likely long-term consequence is:',
   options:['No consequence, since the funding gap is resolved','PROC2070 approval will be automatically withheld','A risk the contingency was sized to cover may materialize later with no funding cushion, and the reduction\u2019s basis will be unclear','The Risk Register will be automatically updated to reflect the change'],
   correct:2,
   explain:'Contingency reductions are decisions about risk exposure, not just numbers. Without documentation, a risk the contingency was meant to cover can materialize later with no cushion \u2014 and without a record of why or when the contingency changed, the situation is harder to explain or address.'}
];
var kcAnswers={};
var kcOrder={}; // kcOrder[qi] = array mapping displayed position -> original option index
function shuffleArray(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}
function buildKCOrder(){
  kcOrder={};
  KC_QUESTIONS.forEach(function(q,qi){
    var idxs=[];
    for(var i=0;i<q.options.length;i++)idxs.push(i);
    kcOrder[qi]=shuffleArray(idxs);
  });
}

function renderKC(){
  kcAnswers={};
  buildKCOrder();
  var qHTML=KC_QUESTIONS.map(function(q,qi){
    var order=kcOrder[qi];
    return '<div class="question-block" id="kc-q-'+qi+'">'
    +'<div class="question-num">Question '+(qi+1)+' of '+KC_QUESTIONS.length+'</div>'
    +'<span class="question-tag">'+q.tag+'</span>'
    +'<div class="question-text">'+q.text+'</div>'
    +order.map(function(origIdx,pos){
      return '<div class="answer-option" id="kc-opt-'+qi+'-'+pos+'" onclick="selectKCAnswer('+qi+','+pos+')">'
      +'<div class="answer-radio"><div class="answer-radio-dot"></div></div>'+q.options[origIdx]+'</div>';
    }).join('')
    +'<div class="kc-explain" id="kc-explain-'+qi+'"><strong>Why:</strong> '+q.explain+'</div>'
    +'</div>';
  }).join('');
  return '<div class="screen active">'+renderNav()
  +'<p class="eyebrow">Knowledge Check &middot; 5 Questions &middot; 60% to Pass</p>'
  +'<h2 class="title-main" style="font-size:1.625rem;">Doctrine &amp; Judgment</h2>'
  +'<p class="lede">Some questions have a single correct doctrinal answer. Others ask what the project manager should do \u2014 choose the best course of action and read the explanation after answering either way.</p>'
  +qHTML
  +'<div class="kc-feedback" id="kc-feedback"></div>'
  +'<div class="btn-row" id="kc-btn-row"><button class="btn-primary" id="kc-submit-btn" onclick="submitKC()" disabled>Submit Answers</button></div>'
  +'</div>';
}

function selectKCAnswer(qi,oi){
  document.querySelectorAll('[id^="kc-opt-'+qi+'-"]').forEach(function(el){el.classList.remove('selected');});
  kcAnswers[qi]=oi;
  document.getElementById('kc-opt-'+qi+'-'+oi).classList.add('selected');
  if(Object.keys(kcAnswers).length===KC_QUESTIONS.length){
    document.getElementById('kc-submit-btn').disabled=false;
  }
}

function submitKC(){
  var correct=0;
  KC_QUESTIONS.forEach(function(q,qi){
    var order=kcOrder[qi];
    var selPos=kcAnswers[qi];
    var selOrigIdx=order[selPos];
    var correctPos=order.indexOf(q.correct);
    var isCorrect=selOrigIdx===q.correct;
    if(isCorrect)correct++;
    document.querySelectorAll('[id^="kc-opt-'+qi+'-"]').forEach(function(el){el.classList.remove('selected');});
    document.getElementById('kc-opt-'+qi+'-'+selPos).classList.add(isCorrect?'correct':'incorrect');
    if(!isCorrect)document.getElementById('kc-opt-'+qi+'-'+correctPos).classList.add('correct');
    document.getElementById('kc-explain-'+qi).classList.add('show');
  });
  CS.kcScore=correct;
  var pct=Math.round((correct/KC_QUESTIONS.length)*100);
  var passed=pct>=60;
  var fb=document.getElementById('kc-feedback');
  fb.className='kc-feedback show '+(passed?'pass':'fail');
  fb.innerHTML='<div class="kc-score '+(passed?'pass':'fail')+'">'+correct+'/'+KC_QUESTIONS.length+'</div>'
  +(passed?'<strong>Well done.</strong> You have completed Case File 05.':'<strong>Review the explanations above.</strong> Score 60% or higher to complete this case file.');
  var btnRow=document.getElementById('kc-btn-row');
  if(passed){
    CS.sectionsComplete.kc=true;saveState();
    btnRow.innerHTML='<button class="btn-primary" onclick="goSection(\'complete\')">Finish Case File &rarr;</button>';
  } else {
    btnRow.innerHTML='<button class="btn-primary" onclick="retakeKC()">Retake Knowledge Check</button>';
  }
}
function retakeKC(){kcAnswers={};goSection('kc');}

function renderComplete(){
  return '<div class="screen active">'
  +'<div class="complete-wrap">'
  +'<div class="complete-seal">&#10003;</div>'
  +'<div class="complete-title">Case File 05 Complete</div>'
  +'<div class="complete-sub">'+CS.name+' &middot; The Number Doesn&#39;t Fit &middot; Score: '+CS.kcScore+'/5</div>'
  +'<div style="text-align:left;max-width:480px;margin:0 auto 20px;">'
  +'<label class="field-label">What is one thing you will do differently this week, based on this case?</label>'
  +'<textarea class="reflect-input" id="commitment" placeholder="Type your commitment..."></textarea>'
  +'</div>'
  +'<div class="btn-row" style="justify-content:center;"><button class="btn-primary" onclick="saveCommitment()">Save &amp; Finish</button>'
  +'<button class="btn-secondary" onclick="restartCase()">Restart Case File</button></div>'
  +'<p style="font-size:0.625rem;color:var(--white-dim);margin-top:18px;">Interactive PM in USACE &middot; <a href="https://leanne-vantuyl.github.io/interactive-pm-usace/CaseFile06_FeedbackConversation.html" style="color:var(--gold);text-decoration:underline;">Continue to Case File 06 &rarr;</a> &middot; <a href="https://leanne-vantuyl.github.io/interactive-pm-usace/index.html" style="color:var(--white-dim);text-decoration:underline;">Course Home</a></p>'
  +'</div></div>';
}
function saveCommitment(){
  CS.commitment=document.getElementById('commitment').value;
  saveState();
  alert('Saved. Thank you for completing Case File 05.');
}
function restartCase(){
  if(confirm('This will clear your progress for this case file. Continue?')){
    try{localStorage.removeItem(STORAGE_KEY);}catch(e){}location.reload();
  }
}

// ===== INIT =====
(function init(){render();})();
</script>

</html>
