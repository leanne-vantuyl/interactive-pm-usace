w the project's full history and could connect the specific lessons to the specific decisions that preceded them. What did the historical thread reveal?"}, "Futuristic": {"01": "Futuristic saw Maria's first week as the foundation for everything that would follow \u2014 the charter you set now would shape every decision for the duration of the project. What did you build that would still be serving the project two years from now?", "02": "Your Futuristic saw the scope-schedule conflict as a signal about the future \u2014 if this tension existed now, what did it predict about the project's next six months? What did you do in CF02 to address the pattern, not just the instance?", "03": "Futuristic looked at the WBS gap and asked: what systemic change would prevent this from happening on every project that follows? What did you recommend \u2014 not just for Maria's project, but for the program?", "04": "Your Futuristic saw the basis-of-estimate gap as a scheduling culture problem \u2014 not a Priya problem. What did you envision for how the district's scheduling practice should look in five years?", "05": "Futuristic saw the funding gap as a budgeting process problem that would recur until the front-end cost estimation process was improved. What did you recommend upstream?", "06": "Your Futuristic saw Pat's workload conflict as a symptom of a resourcing system that needed to change. What did you envision for how that system should work \u2014 and what would it take to get there?", "07": "Futuristic saw the Ashford call as a symptom of a reporting culture that needed to change \u2014 where variance is surfaced reactively rather than proactively. What does the future state look like?", "08": "Your Futuristic saw Marcus's risk capture as the beginning of a better risk culture \u2014 one where risks are identified in conversation and logged immediately. What does that culture look like at scale?", "09": "Futuristic designed the future state of Maria's PDT meetings \u2014 not just recovered this one, but redesigned the meeting architecture for the rest of the project. What changed?", "10": "Your Futuristic saw CF10 as an opportunity to improve the district's change management culture \u2014 one where the approval chain is understood and followed without needing to enforce it. What does that future state look like?", "11": "Futuristic saw the chiller opportunity as a proof of concept for a better opportunity management process \u2014 one that the whole portfolio could adopt. What did you capture in the Register that would help the next team?", "12": "Your Futuristic saw Raj's request as a signal about workload culture \u2014 if senior PMs are being asked to do informal reviews, something in the system needs to change. What does the future state look like?", "13": "Futuristic looked at CF13's closeout and asked: what would it look like if every project in the portfolio closed this well? What systemic change would make that possible?"}, "Ideation": {"01": "Ideation generated multiple approaches to Maria's first week \u2014 not just the obvious one. What was the most creative approach you considered, and why did you ultimately choose what you chose?", "02": "Your Ideation found an unexpected connection in the scope-schedule conflict \u2014 a reframe that changed what the disagreement was actually about. What was it?", "03": "Ideation saw the WBS gap as a design problem, not just a documentation failure. What would a scope management process look like that made this kind of gap structurally impossible?", "04": "Your Ideation found a novel way to ask the basis-of-estimate question \u2014 one that didn't trigger defensiveness. What was the reframe, and how did it change the conversation?", "05": "Ideation generated more than three options for the funding gap. What was the fourth option \u2014 the one that wasn't obvious \u2014 and why did you or didn't you present it to the DPM?", "06": "Your Ideation reframed the feedback conversation entirely when Pat's disclosure changed the situation. What was the new frame \u2014 and was it more useful than the OIR structure?", "07": "Ideation found a different way to structure the variance narrative \u2014 one that was more useful than the standard bottom line-cause-recovery sequence. What was it?", "08": "Your Ideation found a creative way to help Marcus understand why the two-minute capture mattered \u2014 not just 'PROC requires it' but something that made the practice feel meaningful. What was it?", "09": "Ideation designed a meeting recovery technique that wasn't on the slide \u2014 something specific to this room, this situation. What was it?", "10": "Your Ideation found a way to satisfy the contractor's supply chain problem AND maintain scope integrity \u2014 not by choosing one or the other, but by finding a third path. What was it?", "11": "Ideation saw the chiller opportunity as a connection to something else \u2014 another constraint, another opportunity, another risk that was now in play. What did you see that others missed?", "12": "Your Ideation found a creative redirect for Raj \u2014 not just 'I can look at it Thursday' but something that actually served both of your needs better than the original request. What was it?", "13": "Ideation reframed the AAR in a way that made people more honest than the standard four-question structure would have. What was the reframe?"}, "Input": {"01": "Input wanted more information before acting \u2014 which charter fields were wrong, which relationships were established, which risks were already known. What did you gather in Maria's first week before making your first move?", "02": "Your Input collected both positions fully before attempting to facilitate a resolution. What did each PDT member say \u2014 exactly \u2014 and how did the complete picture change your understanding of the conflict?", "03": "Input would have read the full scope statement, the full design package, and the full study report before the sponsor conversation. What did that comprehensive read reveal that a quick scan would have missed?", "04": "Your Input wanted the complete history of the schedule before challenging the HVAC duration \u2014 not just the current baseline, but the original estimate, the basis, and any revisions. What did you find?", "05": "Input gathered all the cost data before presenting the options \u2014 IGE, SIOH calculation, contingency draw history, funding ceiling justification. What was in that complete picture?", "06": "Your Input listened to Pat's complete disclosure before responding \u2014 not just the headline workload conflict, but the full context of when it started, how many projects, what the supervisor knew. What did the complete story tell you?", "07": "Input wanted all three diagnostic steps completed before calling Col. Ashford back. What data did you have after each step \u2014 and was it enough to give a complete answer?", "08": "Your Input wanted all eight Risk Register fields populated \u2014 not just the description and probability, but the full entry including trigger, owner, response strategy, and response action. What did completeness reveal?", "09": "Input had collected the full agenda, the full PDT membership list, and the full list of decisions before the meeting. What in that preparation would have prevented the derailment?", "10": "Your Input gathered the full specification, the contractor's proposal, and comparable precedents before classifying the substitution. What did the complete picture tell you?", "11": "Input wanted to know the crew's full commitment before redirecting them \u2014 not just the current activity, but the full downstream impact. What did the complete picture of their schedule reveal?", "12": "Your Input listened to Raj's full request before responding \u2014 not just the surface ask, but what was behind it and what he actually needed. What did the full picture tell you?", "13": "Input wanted the complete project history in the room before the AAR began \u2014 timeline, decisions, near-misses, informal communications. What did the complete picture surface that the standard four questions would have missed?"}, "Intellection": {"01": "Intellection spent time with the charter gap before acting \u2014 thinking through what the absence of each field actually meant for the project's decision-making capacity. What did that thinking surface?", "02": "Your Intellection sat with the scope-schedule conflict longer than most people at the table \u2014 because you sensed there was a more fundamental issue beneath the surface disagreement. What did you find?", "03": "Intellection traced the WBS gap through its implications \u2014 not just 'the scope wasn't documented' but what that undocumentation meant for the schedule, the cost estimate, and the sponsor relationship. What was the full chain?", "04": "Your Intellection thought about the basis-of-estimate question from multiple angles before raising it \u2014 how Priya would receive it, what the answer might reveal, what it would mean for the project regardless of her response. What did that thinking prepare you for?", "05": "Intellection thought through all three options before presenting them \u2014 not just the mechanics of each, but the second and third-order consequences. What did that deeper thinking reveal about the options?", "06": "Your Intellection processed Pat's disclosure overnight \u2014 because Intellection knows that the first interpretation is rarely the complete one. What did you understand on reflection that you didn't understand in the moment?", "07": "Intellection built the three-sentence variance narrative carefully \u2014 choosing each word for its precision and its effect. What were the words you considered and rejected, and why?", "08": "Your Intellection thought through the full implications of the vendor risk before populating the Register \u2014 not just probability and impact, but the chain of consequences if the trigger was reached. What did that thinking produce?", "09": "Intellection diagnosed the meeting failure at a deeper level than 'we ran out of time.' What was the structural or relational issue that caused the derailment \u2014 and what would have to change for it not to happen again?", "10": "Your Intellection sat with the ambiguity of CF10 rather than rushing to a classification. What did the time with the question reveal that an immediate answer would have missed?", "11": "Intellection thought through the second-order consequences of the chiller opportunity before acting \u2014 not just 'what does this affect' but 'what does that affect, and then what?' What did the chain reveal?", "12": "Your Intellection thought about Raj's request from Raj's perspective \u2014 why he asked, what he was trying to accomplish, what a truly helpful response would look like. What did that thinking produce?", "13": "Intellection made the AAR richer \u2014 because you asked 'why was there a difference' and didn't accept the first answer. What was the deeper cause beneath the surface explanation?"}, "Learner": {"01": "Learner approached Maria's situation as a case study \u2014 what does this specific context teach about how charter gaps develop and what the PM can do about them? What did you learn that you'll carry forward?", "02": "Your Learner saw the scope-schedule conflict as a live example of the principle from the lesson \u2014 that scope conflicts come from undocumented assumptions. What did the scenario teach you about where the assumption actually lived?", "03": "Learner traced the WBS gap with genuine curiosity \u2014 not 'whose fault is this' but 'how does this kind of gap develop and what prevents it?' What did CF03 teach you about scope management?", "04": "Your Learner was genuinely curious about the basis-of-estimate question \u2014 what does a good basis actually look like, and how would you know one if you saw it? What did you learn in CF04?", "05": "Learner was absorbing the three-option framework as a transferable skill \u2014 not just for CF05, but for every funding gap conversation. What did you learn about how to present it most effectively?", "06": "Your Learner saw the OIR model as a new tool to genuinely master \u2014 not just apply. What did the practice in CF06 teach you about which component is hardest to get right?", "07": "Learner used the EVM exercise to genuinely understand the math \u2014 not just calculate the numbers but understand what SPI and CPI actually mean about the state of the project. What clicked?", "08": "Your Learner came away from CF08 understanding something new about risk \u2014 about the difference between a risk, an assumption, and an issue, and why that distinction matters. What was the insight?", "09": "Learner studied the meeting recovery techniques as a new competency. Which one required the most practice to execute well \u2014 and what did the role-play teach you that the concept didn't?", "10": "Your Learner absorbed the change management typology \u2014 creep vs. clarification vs. sponsor-directed vs. substitution. What example from your own project does each category map to?", "11": "Learner was genuinely learning the opportunity response strategies \u2014 Exploit, Enhance, Share \u2014 as a new framework. Which one was most counterintuitive, and what did CF11 teach you about when to use it?", "12": "Your Learner saw the Eisenhower Matrix as a diagnostic tool to study and master. What did CF12 teach you about your own Q3 patterns \u2014 the requests you say yes to that you shouldn't?", "13": "Learner came away from CF13 with a deeper understanding of what makes a lesson transferable. What's the difference between an observation and a lesson \u2014 and what did the AAR exercise teach you about how to produce the latter?"}, "Strategic": {"01": "Strategic saw the charter gap as one symptom of a larger pattern \u2014 a project that had been managed reactively, without a clear decision architecture. What was the strategic move that would address the pattern, not just the symptom?", "02": "Your Strategic sorted through multiple paths in CF02 before anyone else had finished stating the problem. What paths did you see \u2014 and how did you choose among them?", "03": "Strategic identified the strategic implication of the WBS gap immediately: this was not a documentation failure, it was a scope governance failure. What did that diagnosis mean for the approach?", "04": "Your Strategic saw the HVAC conversation as a choice point with multiple branches. What were the paths, and which one did you choose \u2014 and why?", "05": "Strategic identified the real problem beneath the funding gap: the project was set up without a realistic cost framework, and the gap was inevitable. What was the strategic recommendation \u2014 not just for this gap, but for the project going forward?", "06": "Your Strategic saw Pat's workload conflict as a choice point: address the symptom (the performance gap) or address the cause (the resourcing conflict). Which path did you take \u2014 and what were the downstream implications?", "07": "Strategic sorted through the options in the Ashford call in real time \u2014 what to say, what not to say, how to be honest without creating more alarm than the situation warranted. What was the strategic choice?", "08": "Your Strategic saw the vendor risk not just as a single entry but as a signal about a category of risk \u2014 delivery dependencies \u2014 that probably appeared elsewhere in the Register too. What did you do with that pattern?", "09": "Strategic found the path through the derailed meeting \u2014 not just one recovery technique, but the sequence that would get the most important decision made and preserve as much of the remaining agenda as possible. What was the sequence?", "10": "Your Strategic saw CF10 as a fork: follow the formal process (slower, correct) or authorize informally (faster, wrong). What was the downstream implication of the informal path that made the formal one clearly right?", "11": "Strategic saw the chiller opportunity as a branch point with multiple downstream paths \u2014 capture it, defer it, or let it pass. What were the strategic implications of each path?", "12": "Your Strategic saw CF12 as a prioritization decision, not a relationship decision. What was the strategic frame that made the right choice clear \u2014 even when the relational cost of it was real?", "13": "Strategic saw the AAR as the beginning of something, not the end \u2014 the lessons from CF13 should travel forward and change how the next project is managed. What was the strategic use of this AAR's output?"}};

function buildPicker() {

  for (let i = 0; i < 5; i++) {
    html += `<select class="theme-select" id="t${i}" onchange="updateFromSelects()">
      <option value="">#${i+1} theme...</option>
      ${ALL_THEMES.map(t => `<option value="${t}"${selected[i]===t?' selected':''}>${t}</option>`).join('')}
    </select>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function updateFromSelects() {
  selected = [];
  for (let i = 0; i < 5; i++) {
    const v = document.getElementById('t'+i).value;
    if (v) selected.push(v);
  }
}

function generateHandout() {
  updateFromSelects();
  if (selected.length < 5) { alert('Please select all 5 themes.'); return; }
  try { localStorage.setItem('pm-sf-themes', JSON.stringify(selected)); } catch(e) {}

  document.getElementById('empty-state').style.display = 'none';
  const content = document.getElementById('handout-content');
  content.style.display = 'block';

  const themeListHTML = selected.map((t,i) =>
    `<div class="theme-pill rank-${i+1}"><span class="rank">#${i+1}</span>${t}</div>`
  ).join('');

  const rankLabels = ['#1', '#2', '#3', '#4', '#5'];
  const rankClasses = ['', 'r2', 'r3', 'r4', 'r5'];

  const cfsHTML = Object.entries(CF_TITLES).map(([num, title]) => {
    const phase = CF_PHASES[num];
    const color = PHASE_COLORS[phase] || '#2C3E6B';
    const promptsHTML = selected.map((theme, i) => {
      const text = SF_PROMPTS[theme] && SF_PROMPTS[theme][num];
      if (!text) return '';
      return `
        <div class="prompt-entry">
          <div class="prompt-rank-tag ${rankClasses[i]}">${rankLabels[i]} &mdash; ${theme}</div>
          <div class="prompt-text">${text}</div>
        </div>`;
    }).join('');
    return `
      <div class="cf-row">
        <div class="cf-hdr">
          <div class="cf-num">CF ${num}</div>
          <div class="cf-title">${title}</div>
          <div class="phase-tag" style="background:${color}">${phase}</div>
        </div>
        <div class="prompt-stack">${promptsHTML}</div>
        <div class="reflection-space">
          <div class="reflection-line"></div>
          <div class="reflection-line"></div>
          <div class="reflection-line"></div>
          <div class="reflection-line"></div>
        </div>
      </div>
    `;
  }).join('<div class="section-break"></div>');

  content.innerHTML = `
    <div class="handout-header">
      <h1>PM in USACE -- StrengthsFinder Debrief Guide</h1>
      <div class="subtitle">Personalized reflection prompts for each case file &middot; Process, People, and Judgment</div>
      <div class="participant-line">
        <div class="field"><label>Participant Name</label><div class="line"></div></div>
        <div class="field"><label>Cohort / Session</label><div class="line"></div></div>
        <div class="field"><label>Date</label><div class="line"></div></div>
      </div>
    </div>
    <div class="theme-block">
      <div class="theme-label">Your Top 5 CliftonStrengths Themes</div>
      <div class="theme-list">${themeListHTML}</div>
    </div>
    <div class="section-label">CASE FILE DEBRIEF PROMPTS &mdash; ALL FIVE LENSES</div>
    ${cfsHTML}
  `;
}

buildPicker();
</script>
</body>
</html>
