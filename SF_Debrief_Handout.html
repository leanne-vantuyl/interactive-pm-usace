<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM in USACE -- Personalized StrengthsFinder Debrief Handout</title>
<style>
@media print {
  body { margin: 0; font-size: 10pt; }
  .no-print { display: none; }
  .page-break { page-break-before: always; }
}
:root {
  --dark: #1A1A2E; --navy: #2C3E6B; --gold: #8B6914;
  --sf: #5B2D8E; --white: #F5F2EB; --gray: #6B7280;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Calibri, Arial, sans-serif; background: #F0F0EA; color: #111; }

.no-print {
  background: var(--dark); color: var(--white); padding: 20px 32px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.no-print h1 { font-size: 1.1rem; }
.no-print p { font-size: .8rem; color: #AAA; margin-top: 4px; }
.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn { padding: 8px 16px; font-size: .85rem; cursor: pointer; border-radius: 3px; border: none; font-weight: 700; }
.btn-gold { background: #8B6914; color: #fff; }
.btn-print { background: #2C3E6B; color: #fff; }
.theme-select { font-size: .85rem; padding: 7px 10px; border-radius: 3px; border: 1px solid #444; background: #1E2440; color: #fff; }

.handout { max-width: 800px; margin: 24px auto; background: #fff; padding: 36px 40px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
@media print { .handout { box-shadow: none; margin: 0; max-width: 100%; padding: 20px; } }

.handout-header { border-bottom: 3px solid var(--gold); padding-bottom: 16px; margin-bottom: 24px; }
.handout-header h1 { font-size: 1.4rem; color: var(--dark); }
.handout-header .subtitle { font-size: .85rem; color: var(--gray); margin-top: 4px; }
.participant-line { display: flex; gap: 32px; margin-top: 12px; }
.participant-line .field { flex: 1; }
.participant-line .field label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gray); }
.participant-line .field .line { border-bottom: 1px solid #CCC; margin-top: 6px; height: 22px; }

.theme-block { background: rgba(91,45,142,.08); border: 1px solid rgba(91,45,142,.2); padding: 14px 16px; margin-bottom: 20px; border-radius: 3px; }
.theme-block .theme-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--sf); font-weight: 700; margin-bottom: 8px; }
.theme-list { display: flex; gap: 10px; flex-wrap: wrap; }
.theme-pill { background: var(--sf); color: #fff; padding: 4px 12px; font-size: .8rem; border-radius: 2px; font-weight: 700; }
.theme-pill.rank-2 { background: #3D1D6B; }
.theme-pill.rank-3,.theme-pill.rank-4,.theme-pill.rank-5 { background: #1A0A2E; }
.theme-pill .rank { font-size: .65rem; opacity: .7; margin-right: 4px; }

.cf-row { margin-bottom: 14px; page-break-inside: avoid; }
.cf-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.cf-num { font-size: 1rem; font-weight: 700; color: var(--gold); font-family: Cambria, serif; width: 36px; flex-shrink: 0; }
.cf-title { font-size: .9rem; font-weight: 700; color: var(--dark); }
.phase-tag { font-size: .6rem; font-weight: 700; padding: 2px 6px; color: #fff; border-radius: 2px; }
.prompt-stack { margin-left: 46px; border-left: 3px solid rgba(91,45,142,.25); padding: 0; }
.prompt-entry { padding: 8px 12px; border-bottom: 1px solid rgba(91,45,142,.1); }
.prompt-entry:last-child { border-bottom: none; }
.prompt-rank-tag { display: inline-block; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #fff; background: var(--sf); padding: 2px 6px; border-radius: 2px; margin-bottom: 4px; }
.prompt-rank-tag.r2 { background: #3D1D6B; }
.prompt-rank-tag.r3, .prompt-rank-tag.r4, .prompt-rank-tag.r5 { background: #1A0A2E; }
.prompt-text { font-size: .83rem; color: #111; line-height: 1.6; }
.reflection-space { margin-left: 46px; margin-top: 8px; }
.reflection-line { border-bottom: 1px solid #DDD; height: 22px; margin-bottom: 5px; }

.section-break { border-top: 1px solid #EEE; margin: 20px 0; }
.section-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gray); margin-bottom: 12px; font-weight: 700; }

.empty-state { text-align: center; padding: 40px; color: var(--gray); }
.empty-state p { font-size: .9rem; line-height: 1.7; }
</style>
</head>
<body>

<div class="no-print">
  <div>
    <h1>PM in USACE -- Personalized StrengthsFinder Debrief Handout</h1>
    <p>Select your top 5 themes to generate your personalized handout, then print.</p>
  </div>
  <div class="controls">
    <div id="theme-picker"></div>
    <button class="btn btn-gold" onclick="generateHandout()">Generate Handout</button>
    <button class="btn btn-print" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>

<div class="handout" id="handout">
  <div class="empty-state" id="empty-state">
    <p>Select your top 5 StrengthsFinder themes above<br>and click <strong>Generate Handout</strong> to create your personalized debrief guide.</p>

</div>

<script>
const SF_PROMPTS = {"Achiever": {"01": "Your Achiever drive means you felt the urgency of Maria's situation immediately \u2014 but urgency without a plan is just anxiety. Which of your three commitments in CF01 moved the project forward, and which one just felt productive?", "02": "Achiever pushes you to resolve conflict quickly so the work can continue \u2014 but some tensions need to be held, not fixed. Where did you feel the pull to close the scope-schedule disagreement before it was actually resolved?", "03": "When the gap between the scope statement and the sponsor's expectation appeared, your Achiever likely wanted to fix it fast. What would it have cost to slow down and document the gap before acting?", "04": "Achiever makes you want to correct the schedule and move on \u2014 but the relationship with Priya is part of the work. How did you balance getting the number right with keeping the collaboration intact?", "05": "Your Achiever wants a solution and wants it now \u2014 but the funding gap requires a structured presentation, not a quick fix. Where did the pressure to produce an answer conflict with the discipline to present options first?", "06": "Achiever can make feedback conversations feel like productivity \u2014 you want to check the box and move on. What happened to the conversation when Pat's workload constraint changed what 'done' looked like?", "07": "Your Achiever felt the pressure of Col. Ashford's call acutely \u2014 because Achiever hates being caught unprepared. What did that pressure do to your diagnostic discipline?", "08": "Achiever logs the risk and moves on. The danger is that 'logged' feels like 'handled.' What did you do with Marcus's comment after it went on the Register?", "09": "Your Achiever wanted the meeting to produce outcomes \u2014 and when it started slipping, you felt it physically. Which recovery technique matched your Achiever's need to finish what was started?", "10": "Achiever wants authorization and wants to proceed \u2014 waiting for the formal process feels like lost time. What did that impatience cost Maria in CF10?", "11": "Your Achiever saw the chiller opportunity and wanted to capture it immediately. Did you run the pre-action check \u2014 or did the drive to act override the discipline to check?", "12": "Achiever makes it hard to say no because every request feels like an opportunity to produce. What did you actually give up when Maria said yes to Raj?", "13": "Your Achiever wants the AAR to be efficient and productive \u2014 but the most useful AARs are sometimes slow and uncomfortable. Where did you feel the tension between closing well and closing fast?"}, "Arranger": {"01": "Arranger's first instinct in a new situation is to figure out how all the pieces fit \u2014 who does what, who has authority, who needs to talk to whom. How did that instinct serve Maria in CF01, and where did it hit a wall?", "02": "When two constraints collide, Arranger wants to reconfigure the resources to satisfy both. Was there a configuration that could have honored both the schedule and the scope \u2014 or was this a decision that required giving something up?", "03": "Arranger would have caught the WBS gap early \u2014 because you naturally track how deliverables connect. What would have to be in place for that instinct to surface the gap before designs were complete?", "04": "Your Arranger saw the schedule as a puzzle with a wrong piece. How did you approach the conversation with Priya \u2014 as a reconfiguration problem or as a confrontation?", "05": "Arranger is good at finding the third option when the first two are blocked. What creative reconfiguration of scope, funding, or timeline did you see that others at your table missed?", "06": "When Pat's workload conflict emerged, your Arranger immediately started mapping the solution: who else could absorb the work, how could the assignments shift. Was that the right move \u2014 or did Maria need to hear more first?", "07": "Arranger wants to know the full picture before responding \u2014 but Col. Ashford called before the picture was complete. How did you manage the gap between your need for the full arrangement and the pressure to respond?", "08": "Your Arranger would naturally track who owns what risk and whether the response chain is logical. Was Marcus's register entry complete enough to satisfy that need \u2014 owner, trigger, response all connected?", "09": "A derailed meeting is an Arranger's opportunity \u2014 you can see how to restructure the remaining time to recover the outcomes. Which rearrangement would you have made with Maria's 30 minutes?", "10": "Arranger sees the approval chain as a system to navigate efficiently \u2014 but sometimes the system needs to be followed even when a workaround seems obvious. What was the cost of bypassing the chain in CF10?", "11": "Your Arranger saw the chiller opportunity as a puzzle: which crew, which commitment, which sequence. Did the pre-action check feel like discipline \u2014 or like exactly what your Arranger would do anyway?", "12": "Arranger is good at redirecting resources \u2014 including your own time. Did you find a way to give Raj something without giving him the afternoon? What did that arrangement look like?", "13": "Your Arranger would structure an AAR that captures everything efficiently. What's the tension between an efficient AAR and one that actually surfaces the uncomfortable lessons?"}, "Belief": {"01": "Belief gives you a strong sense of what a PM should do \u2014 and a charter with the wrong name violates that sense directly. How did your values shape which action you prioritized first?", "02": "When two people you respect disagree, Belief can make you feel pressure to take the side that aligns with your values. Did you find yourself pulled toward one position in CF02 \u2014 and was that pull about the project or about what you believe is right?", "03": "Belief gives you conviction that the right thing is to surface the gap \u2014 even when it's awkward. What did that conviction cost you in the scenario, and what would it have cost to stay quiet?", "04": "Your Belief in doing things right makes template-default thinking genuinely uncomfortable. How did you name that discomfort in the conversation with Priya without making it a moral judgment?", "05": "Belief means you are unlikely to quietly adjust the estimate to fit the ceiling \u2014 that would feel like a violation. How did your values shape the way you framed the options for the DPM?", "06": "Belief can make a workload problem feel like a fairness problem \u2014 and Pat's situation may have triggered that. How did you separate the project problem from the values response?", "07": "Your Belief in transparency made the pressure from Col. Ashford feel acute \u2014 you don't want to mislead, but you also don't have the data yet. How did you hold that tension?", "08": "Belief gives you a strong sense of obligation \u2014 when Marcus told you about the vendor, you felt it was your responsibility to act. How quickly did you act, and was the action proportionate?", "09": "Your Belief in respect means you feel the relational cost of the parking lot acutely \u2014 you don't want anyone to feel dismissed. How did you balance honoring the concern with recovering the meeting?", "10": "Belief gives you clarity on this one: verbal approvals are not approvals, and proceeding without documentation is wrong. How did that conviction affect how you responded to the contractor?", "11": "Your Belief system includes stewardship \u2014 using public resources wisely. How did that shape your decision about whether to capture the chiller opportunity?", "12": "Belief makes the favor trap complicated \u2014 because saying no can feel like a violation of your relational values. How did you reconcile the obligation to Raj with the obligation to your project?", "13": "Your Belief in honoring the team's work makes a good AAR feel essential. What would it have cost \u2014 relationally and organizationally \u2014 to skip it or rush it?"}, "Consistency": {"01": "Consistency wants clear rules applied equally \u2014 and a charter with the wrong PM name is a process violation that consistency finds intolerable. How quickly did you identify the documentation gap, and what did you do with it?", "02": "When two people disagree about scope and schedule, Consistency looks for the rule that resolves it. What does PROC2010 say \u2014 and did the doctrine actually settle the disagreement?", "03": "Your Consistency makes WBS gaps uncomfortable because they mean the process wasn't followed uniformly. What should have happened at the WBS level \u2014 and who should have caught it?", "04": "Consistency believes that if PROC2030 requires a basis of estimate, it requires it for every duration \u2014 not just the ones that get questioned. How did that belief shape your conversation with Priya?", "05": "Your Consistency instinct says: the funding gap should have been visible earlier, and it wasn't because the process wasn't followed. Where did the process break down \u2014 and at what step?", "06": "Consistency is good at identifying when someone is being held to a standard they weren't given the resources to meet. Did Pat's workload conflict feel like a fairness problem to you?", "07": "Your Consistency wants a standard protocol for variance responses \u2014 and the three-sentence narrative is that protocol. Did following the structure feel natural, or did the pressure from Col. Ashford make you want to improvise?", "08": "Consistency believes everyone's risk should be logged with the same discipline. When Marcus mentioned the vendor, did you feel the obligation to document it apply equally \u2014 regardless of whether Marcus had flagged it formally?", "09": "Your Consistency wants meetings run the same way every time \u2014 agenda, parking lot, follow-up, 24 hours. Did Maria's meeting structure match that standard? What was missing?", "10": "Consistency is clear on this: the approval chain applies to every change, every time. No exceptions for small substitutions, no exceptions for schedule benefits. How did you communicate that in CF10?", "11": "Your Consistency wants the pre-action check applied to every opportunity, every time \u2014 not just the ones that feel risky. Did you run all three questions, or did the obvious benefit make you skip one?", "12": "Consistency asks: if Maria said yes to Raj, would she say yes to the same request from someone she didn't know as well? If not \u2014 that's a consistency problem, not just a priority problem.", "13": "Your Consistency wants the closeout checklist completed the same way every time, by every PM, on every project. What's the one item that most often gets skipped \u2014 and what's the cost when the next team inherits that gap?"}, "Deliberative": {"01": "Deliberative wanted more information before acting \u2014 and in Maria's situation, that instinct was right. What did you identify as the things you needed to know before making your first move?", "02": "Your Deliberative felt uncomfortable with both options in the scope-schedule disagreement \u2014 because both had risks that hadn't been fully assessed. What additional information would have made you more confident in a recommendation?", "03": "Deliberative would have paused at the scope statement and asked the three alignment questions before designs began. What's the cost of that pause \u2014 and what's the cost of skipping it?", "04": "Your Deliberative wanted to verify the HVAC duration before raising it. How did you build the case without tipping your hand before you were ready?", "05": "Deliberative doesn't like the Data-Options-Recommendation framework when the data is incomplete. What data was missing from the CF05 funding gap analysis \u2014 and how did that affect the quality of the options?", "06": "Your Deliberative sensed that Pat's workload disclosure changed the nature of the conversation \u2014 and wanted to pause and reassess. Did you give yourself permission to do that, or did the agenda pressure keep you moving?", "07": "Deliberative wanted to verify the data before calling Col. Ashford back. How long is an acceptable pause \u2014 and how do you communicate that you're being careful, not avoiding?", "08": "Your Deliberative would have wanted to assess the vendor risk more carefully before logging it \u2014 probability, impact, trigger. Did you populate all the fields, or did the two-minute capture feel rushed?", "09": "Deliberative doesn't like redirecting agenda items without thinking through the implications. When you used the parking lot, did you know what you were giving up \u2014 and was that trade-off worth it?", "10": "Your Deliberative is most comfortable with this scenario \u2014 because Deliberative already suspects verbal approvals, already wants documentation, already wants to slow down before proceeding. How did you communicate that caution without sounding obstructionist?", "11": "Deliberative ran the pre-action check before anyone else at the table. What did you find \u2014 and did your caution create friction with the people who wanted to act immediately?", "12": "Your Deliberative assessed Raj's request carefully before responding. What did that assessment surface that an immediate yes or no would have missed?", "13": "Deliberative is at its best in the AAR \u2014 because you naturally surface the risks and the near-misses that others want to move past. What did you name in the debrief that the rest of the group wasn't ready to say?"}, "Discipline": {"01": "Discipline wants a structured first week \u2014 a clear sequence of actions, each one building on the last. What was your sequence for Maria, and what was the logic behind the order?", "02": "Your Discipline wants the scope-schedule conflict resolved through a defined process, not an improvised conversation. What process would you have invoked \u2014 and did the situation allow for it?", "03": "Discipline catches WBS gaps because you follow the process in order and notice when a step is missing. At what point in the project lifecycle should the gap have been caught?", "04": "Your Discipline found the basis-of-estimate gap immediately \u2014 because you follow the PROC2030 checklist and 'template default' is not a checklist item. How did you communicate the gap without making it feel like an audit?", "05": "Discipline structures the funding gap conversation as Data-Options-Recommendation and won't deviate from the sequence. Did the DPM's pressure make you want to skip straight to the recommendation?", "06": "Your Discipline wanted to follow the OIR model precisely \u2014 observation, then impact, then request. When Pat's disclosure changed the conversation, did the structure hold or did you have to improvise?", "07": "Discipline runs the three-step diagnostic in order: verify data, identify the activity, determine root cause. Did you complete all three before responding to Col. Ashford?", "08": "Your Discipline wanted all eight Register fields populated before moving on. Did the two-minute capture produce a complete entry \u2014 or a placeholder that would need to be finished later?", "09": "Discipline designed the agenda before the meeting. When the meeting went off-track, your Discipline felt it as a structural failure, not just a time problem. What would a Discipline-designed recovery have looked like?", "10": "Your Discipline is least tolerant of verbal approvals \u2014 because Discipline keeps records, follows processes, and doesn't trust informal authorization. How did you document the contractor substitution question?", "11": "Discipline ran all three pre-action check questions in order and didn't skip to action until all three were answered. How long did that take \u2014 and did it feel like the right amount of time?", "12": "Your Discipline structured the AER response precisely: acknowledge, then explain, then redirect \u2014 in that order. Did the structure hold under the relational pressure of the conversation with Raj?", "13": "Discipline builds the closeout schedule before the end of construction. Did you feel that instinct in CF13 \u2014 and what would that schedule have looked like for Maria's project?"}, "Focus": {"01": "Focus wants one clear priority for Maria's first week \u2014 not a list of important things. What was the one thing, and how did you defend it when the situation kept adding more?", "02": "Your Focus found the scope-schedule disagreement distracting \u2014 because the real question was simpler than the argument. What was the real question, and how did you redirect to it?", "03": "Focus would have kept the team on the WBS until it was reconciled with the scope statement, regardless of design schedule pressure. What did that single-mindedness cost \u2014 and what did it protect?", "04": "Your Focus went directly to the HVAC duration because that was the number that mattered. How did you keep the conversation on that number without letting it expand into a general schedule critique?", "05": "Focus wants one recommendation, clearly stated. The three-option framework can feel unfocused to you \u2014 like hedging. How did you present the options while still giving the DPM a clear signal about which one you believed in?", "06": "Your Focus wanted to stay on the feedback agenda \u2014 but when Pat's workload disclosure emerged, the agenda shifted. Did your Focus serve you in that moment, or did it make the pivot harder?", "07": "Focus knew the three-step diagnostic had to run in order before anything else happened. How did you hold that focus when Col. Ashford's call created pressure to respond before the steps were complete?", "08": "Your Focus captured Marcus's comment and went directly to the Register. The two-minute capture is a Focus instinct \u2014 immediate, complete, then move on. Did you stay with Marcus long enough to get all the fields?", "09": "Focus recovers a derailed meeting by naming the one item that must be decided today and cutting everything else. Did the time-check technique feel natural \u2014 or did it feel like abandoning things that mattered?", "10": "Your Focus is clear: this is a change, it needs authorization, and everything else is secondary. How did you communicate that clarity without dismissing the contractor's legitimate reason for the substitution?", "11": "Focus asked one question about the chiller opportunity: what is this crew currently committed to? That one question determined everything else. Did you get a complete answer before deciding?", "12": "Your Focus protected the risk review because it was the one thing that couldn't slip. How did you communicate that to Raj without making it sound like his request didn't matter?", "13": "Focus wants an AAR that stays on the four questions and doesn't drift into general project venting. How did you keep Maria's AAR on the structure when the room wanted to go sideways?"}, "Responsibility": {"01": "Responsibility made Maria's situation feel personal \u2014 someone left this project in disarray, and now it's yours to fix. How did that sense of ownership shape your first-week priorities?", "02": "Your Responsibility felt the weight of both PDT members' positions \u2014 because you feel accountable to both of them. How did you make a decision when honoring both felt impossible?", "03": "Responsibility means the scope gap is yours to fix now, even though you didn't create it. How did that ownership shape your approach \u2014 and where did it make things harder than they needed to be?", "04": "Your Responsibility made Priya's duration feel like your problem to solve \u2014 because if the schedule is wrong, the project outcome is on you. How did you separate your accountability for the outcome from her accountability for the estimate?", "05": "Responsibility means you will not quietly adjust the estimate. You will not pretend the gap doesn't exist. You will surface it and own the conversation. How did that play out with the DPM?", "06": "Your Responsibility for the project outcome made Pat's workload conflict feel urgent \u2014 because if Pat is overloaded, the work suffers, and that's your responsibility. How did you act without overstepping into the functional supervisor's role?", "07": "Responsibility made the Ashford call feel like a test of your accountability. You didn't have the data, but you felt responsible for having it. How did you honor that accountability without overcommitting?", "08": "Your Responsibility means Marcus's casual comment immediately became your obligation. You heard it, which means you own it. How did you act on that ownership?", "09": "Responsibility for the meeting outcomes made the 25-minute loss feel personal. You set the agenda, you called the meeting, you are responsible for what it produces. How did that ownership affect your recovery choices?", "10": "Your Responsibility is unambiguous here: the PM owns the change management process. Whatever the contractor proposed, the authorization responsibility belongs to you. How did you own it?", "11": "Responsibility made the pre-action check feel essential \u2014 because if something goes wrong after redirecting the crew, that's on you. Did that sense of accountability slow you down or protect you?", "12": "Your Responsibility to Raj (as a colleague) and to your project (as PM) pulled in opposite directions. How did you decide which responsibility took precedence \u2014 and how did you communicate that to Raj?", "13": "Responsibility means the closeout is not done until it is actually done \u2014 not until it feels done. What's the one closeout item most likely to get skipped because the project feels complete before it is?"}, "Restorative": {"01": "Restorative is energized by broken things that need fixing \u2014 and Maria's situation is exactly that. What was the first problem you identified, and did you feel the pull to fix it before you fully understood it?", "02": "Your Restorative wanted to diagnose the root cause of the scope-schedule conflict before proposing a solution. Did you get there \u2014 and did the group follow your diagnostic before jumping to resolution?", "03": "Restorative found the WBS gap and felt the satisfaction of naming it precisely. What was the root cause \u2014 not 'the scope wasn't documented' but the specific decision or skip that allowed the gap to persist?", "04": "Your Restorative wanted to fix the schedule \u2014 but the fix required a conversation with Priya first. How did you diagnose the problem (wrong basis of estimate) without making Priya feel like the problem?", "05": "Restorative is good at gap analysis \u2014 and the funding gap is fundamentally a gap analysis problem. What was the root cause of the $2.3M delta, and did your recommendation address the root cause or just the symptom?", "06": "Your Restorative identified the real problem quickly: Pat wasn't underperforming, Pat was overloaded. How did that diagnosis change the conversation \u2014 and what did you do with it?", "07": "Restorative runs the three-step diagnostic naturally \u2014 that's exactly what Restorative does. Verify, identify, determine root cause. What was the actual root cause of the phantom slip in CF07?", "08": "Your Restorative turned Marcus's casual comment into a structured risk entry \u2014 because Restorative hates unaddressed problems. Was the entry complete enough to actually prevent the problem?", "09": "Restorative diagnosed the meeting failure in real time: the agenda design was wrong, the item types weren't sequenced, the parking lot didn't have owners. What would your fix have looked like?", "10": "Your Restorative wanted to find a solution that satisfied the contractor's supply chain problem AND maintained scope integrity. Was there one \u2014 or did this require a hard call?", "11": "Restorative ran the pre-action check because Restorative always looks for what could go wrong before acting. What problem did the check reveal \u2014 and what would have happened if you'd skipped it?", "12": "Your Restorative saw Raj's request as a problem to be solved, not just a request to accept or decline. What was the actual need behind the request, and was there a solution that addressed it?", "13": "Restorative is at its best in an AAR \u2014 because AARs are structured diagnoses of what broke and how to fix it. What was the most important root cause that Maria's AAR should have surfaced?"}, "Activator": {"01": "Activator wanted Maria to act in the first hour \u2014 but some actions in week one would have been premature. Which action did you take immediately, and which one did you have to discipline yourself to delay?", "02": "Your Activator wanted to resolve the scope-schedule conflict and move on. What did you miss by moving too fast \u2014 and what did you gain by acting while others were still deliberating?", "03": "Activator would have convened the sponsor conversation the same day the gap was identified. Was that the right call \u2014 or did Maria need more preparation before that conversation?", "04": "Your Activator raised the duration question immediately. Was the basis of estimate verified before you raised it \u2014 or did you raise it and then look for the evidence?", "05": "Activator wants a decision from the DPM, and wants it now. How did you present the options in a way that moved the DPM toward a decision rather than opening a longer deliberation?", "06": "Your Activator set the feedback agenda, initiated the conversation, and wanted to get through it efficiently. When Pat's disclosure changed everything, did your Activator help or hurt the pivot?", "07": "Activator wanted to call Col. Ashford back immediately \u2014 and Activator hates the phrase 'let me check and get back to you.' How did you manage the tension between your drive to act and the diagnostic discipline?", "08": "Your Activator opened the Register during the check-in, right then, with Marcus in the room. That's the two-minute capture working exactly as designed. Did you get all eight fields before moving on?", "09": "Activator used the time-check to restart momentum \u2014 'we have eight minutes, what must be decided today?' Did the room respond to that energy, or did it take more than one move to recover the meeting?", "10": "Your Activator wanted to authorize the substitution and keep the project moving. What stopped you \u2014 and was that the right thing to stop you?", "11": "Activator captured the chiller opportunity before others were even done deliberating. Did you run the pre-action check first, or did the drive to act get ahead of the discipline to check?", "12": "Your Activator already has a response to Raj before the sentence is finished. What was the response \u2014 and did the speed of it serve the relationship, or short-circuit the thinking?", "13": "Activator opened the AAR with energy and got people talking immediately. What's the risk of that opening \u2014 and how did you ensure the fast start didn't skip the most important first question?"}, "Command": {"01": "Command took charge of the charter situation immediately and clearly. How did you assert Maria's authority in a way that the PDT accepted \u2014 given that she was new and they weren't?", "02": "Your Command is comfortable with conflict \u2014 but scope-schedule disagreements require facilitation, not domination. How did you lead the conversation without closing it down before both positions were fully heard?", "03": "Command named the gap directly and without softening it. How did that directness land with the sponsor \u2014 and what would a less direct approach have cost?", "04": "Your Command raised the HVAC question without hedging. Did that directness make the conversation with Priya productive or defensive?", "05": "Command gave the DPM a clear recommendation, not just options. What was your recommendation \u2014 and how did you communicate it with confidence while still owning the uncertainty in the data?", "06": "Your Command shifted the conversation when Pat's disclosure changed everything. How did you redirect without making Pat feel managed?", "07": "Command told Col. Ashford the truth about what Maria knew and didn't know. How did that directness affect the relationship \u2014 and was it the right call?", "08": "Your Command turned to Marcus during the check-in and said 'let's put that on the Register right now.' That's Command doing exactly what the two-minute capture requires. Did Marcus follow your lead?", "09": "Command recovered the meeting by naming the problem directly: 'we've lost 25 minutes and I need to make two decisions before we close.' How did the room respond to that directness?", "10": "Your Command is clear: this is a change, it needs authorization, and we are not proceeding without it. How did you communicate that to the contractor without creating an adversarial dynamic?", "11": "Command made the call on the chiller opportunity. Did you run the pre-action check first \u2014 or did the clarity of Command make the check feel unnecessary?", "12": "Your Command gave Raj a clear, direct answer. Did the directness of the decline protect the relationship \u2014 or did it need to be softened for the relationship to survive?", "13": "Command opened the AAR by setting the rules: leader speaks last, no blame, specifics only. How did the room respond to that structure \u2014 and did you have to enforce it during the conversation?"}, "Communication": {"01": "Communication wanted to tell Maria's story in a way that made the charter gap feel urgent without being alarming. How did you frame the situation for the DPM \u2014 and what language did you choose?", "02": "Your Communication could have been the bridge between the two PDT members \u2014 translating each position to the other in language they could accept. Did you use that skill in CF02, or did you stay in one camp?", "03": "Communication would have surfaced the scope gap through a conversation, not a memo. How did you open the sponsor conversation \u2014 and what did you say in the first 30 seconds to set the right tone?", "04": "Your Communication found a way to ask 'what is this based on?' that didn't sound like an accusation. What were the exact words \u2014 and how did the framing change what Priya heard?", "05": "Communication structured the funding gap presentation so the DPM could follow it \u2014 data, then options, then recommendation, with transitions that made each step feel logical. How did you narrate the gap?", "06": "Your Communication heard the subtext in Pat's disclosure \u2014 what Pat was really saying beneath the words. What did you hear, and how did it change what you said next?", "07": "Communication crafted the three-sentence variance narrative carefully \u2014 because how you describe a problem determines how the listener responds to it. What was your narrative, word for word?", "08": "Your Communication turned Marcus's casual comment into a Register entry without making it feel like an interrogation. What did you say to Marcus to move from conversation to documentation?", "09": "Communication is the best tool for meeting recovery \u2014 the right words at the right moment can shift a room's energy. What did you say to recover CF09's meeting, and why those words?", "10": "Your Communication wanted to explain the change management process to the contractor in a way that felt collaborative, not bureaucratic. How did you frame the approval chain as a shared process rather than an obstacle?", "11": "Communication narrated the pre-action check to the team in real time \u2014 'before we move on this, let me walk through three questions.' How did that narration affect the team's response to the opportunity?", "12": "Your Communication crafted the AER decline carefully: warm enough to honor the relationship, clear enough to hold the boundary. What were the exact words of your acknowledge, explain, and redirect?", "13": "Communication facilitated the AAR in a way that made people feel safe enough to be honest. What was the opening statement that set that tone \u2014 and why did it work?"}, "Competition": {"01": "Competition wants to be the best PM in the room \u2014 and inheriting a broken charter is a chance to demonstrate that. How did you frame Maria's first week as a performance opportunity, not just a cleanup task?", "02": "Your Competition wanted to resolve the scope-schedule conflict better than anyone else in the room would have. What was your solution \u2014 and how did it outperform the obvious options?", "03": "Competition would have caught the WBS gap before the designs were done \u2014 because you read the scope statement more carefully than most. What did you find that others missed?", "04": "Your Competition wanted to ask the best version of the basis-of-estimate question \u2014 not just correct, but precise and effective. What was your version, and how did it outperform the default?", "05": "Competition benchmarks: what would the best PM in this situation do? How did your recommendation compare to that standard \u2014 and where did you fall short?", "06": "Your Competition wanted to run the best feedback conversation in the class. What made your OIR delivery stand out \u2014 and what would you improve to make it stronger?", "07": "Competition wants to know: who in the room gave the best variance narrative? What made theirs better \u2014 or what made yours the standard?", "08": "Your Competition entered the most complete risk Register entry in the class. What fields did others leave blank that you filled in \u2014 and why does completeness matter?", "09": "Competition looks at meeting recovery as a skill to master. Which recovery technique required the most skill \u2014 and did you execute it at the level you hold yourself to?", "10": "Your Competition wants to be the PM who handles ambiguous change situations most clearly. How did you resolve CF10 in a way that sets the standard \u2014 not just follows it?", "11": "Competition captured the chiller opportunity and ran the pre-action check faster than anyone else. What was your time from opportunity to decision \u2014 and was speed the right metric here?", "12": "Your Competition wanted to deliver the most effective professional decline in the class. What made your AER response better than the generic version \u2014 and what would make it better still?", "13": "Competition wants to run the most effective AAR of any project in the cohort. What would that look like \u2014 and what's one thing you'd do differently from what Maria did?"}, "Maximizer": {"01": "Maximizer doesn't want to fix a broken charter \u2014 you want to build an excellent one. What does an excellent charter look like for Maria's project, and how far was the existing one from that standard?", "02": "Your Maximizer wanted to elevate the scope-schedule conversation from a conflict resolution to a strategic alignment. What would that conversation have looked like at its best?", "03": "Maximizer saw the WBS gap as an opportunity to build a better scope management process, not just fix this instance. What systemic improvement would prevent this gap from occurring on the next project?", "04": "Your Maximizer doesn't just want the schedule corrected \u2014 you want a schedule process that makes this kind of error impossible. What would that process look like?", "05": "Maximizer wants the funding gap presentation to be excellent \u2014 not just adequate. What would the best version of the Data-Options-Recommendation framework look like for the DPM in CF05?", "06": "Your Maximizer saw the feedback conversation as an opportunity to develop Pat into a stronger PDT contributor. How did you use the OIR model to open that development conversation, not just close the performance gap?", "07": "Maximizer wants the variance narrative to be the clearest, most useful variance narrative the DPM has ever received. What made your three sentences stand out?", "08": "Your Maximizer built a Risk Register entry that doesn't just satisfy the REF8007G fields \u2014 it actually gives the next PM everything they need to act on the risk without any additional context. What did you include that others left out?", "09": "Maximizer wants to run excellent meetings \u2014 not just recover bad ones. What's the design change that would have prevented CF09's derailment in the first place?", "10": "Your Maximizer wants a change management process that actually serves the project, not just one that satisfies the doctrine. How would you improve PROC3010 based on CF10?", "11": "Maximizer captured the opportunity and improved the process for capturing future opportunities. What did you put in the Register, and what trigger did you set so the next one gets caught the same way?", "12": "Your Maximizer wanted to transform the decline into a development opportunity for Raj. How did you say no in a way that strengthened the relationship rather than just preserving it?", "13": "Maximizer wants the AAR to produce lessons that actually change how the next project is run \u2014 not just lessons that get filed. What's the one lesson from CF13 that would have the highest leverage if it was actually adopted?"}, "Self-Assurance": {"01": "Self-Assurance walked into Maria's situation without second-guessing whether you had the authority to act. What was your first move \u2014 and how did you communicate ownership of the project from day one?", "02": "Your Self-Assurance was comfortable taking a position in the scope-schedule disagreement even without full information. How did that confidence affect the conversation \u2014 and where did it need to be tempered?", "03": "Self-Assurance named the gap directly and without hedging. How did your certainty about the right course of action hold up when the sponsor pushed back?", "04": "Your Self-Assurance raised the HVAC question without waiting for permission or validation. How did that confidence affect Priya's response \u2014 and the outcome?", "05": "Self-Assurance gave the DPM a clear recommendation without excessive qualification. How did you hold that confidence while acknowledging the genuine uncertainty in the options?", "06": "Your Self-Assurance shifted the conversation when Pat's disclosure changed everything \u2014 without needing to check whether that pivot was appropriate. What did that self-direction look like in the moment?", "07": "Self-Assurance told Col. Ashford the truth clearly, without hedging into vagueness. How did that directness land \u2014 and was it received as confidence or as overreach?", "08": "Your Self-Assurance opened the Register with Marcus right then, without asking permission or checking whether it was the right time. How did Marcus respond to that confidence?", "09": "Self-Assurance recovered the meeting without asking the group whether it was okay to redirect. How did you exercise authority over the agenda without making the room feel managed?", "10": "Your Self-Assurance is clear: this is a change, this is the process, and we are following the process. How did you hold that position when the contractor pushed back on the timeline?", "11": "Self-Assurance acted on the chiller opportunity \u2014 and also ran the pre-action check, because Self-Assurance is confident enough to slow down when it matters. Which instinct led \u2014 confidence or caution?", "12": "Your Self-Assurance gave Raj a clear answer without apologizing for it. How did that confidence affect the relational cost of the decline?", "13": "Self-Assurance facilitated the AAR from a position of authority \u2014 leader speaks last, but you set the frame for everything. How did that authority create space for others to be honest?"}, "Significance": {"01": "Significance wants Maria's first week to set the standard \u2014 to demonstrate what excellent PM looks like. What was the action that would have made the most visible impression on the right people?", "02": "Your Significance wanted to be the person who resolved the scope-schedule conflict \u2014 visibly, effectively, in a way that the DPM would remember. How did you step into that role?", "03": "Significance means the scope gap conversation with the sponsor was also a credibility moment. How did you handle it in a way that demonstrated PM excellence, not just PM adequacy?", "04": "Your Significance wanted the basis-of-estimate challenge to demonstrate your depth \u2014 that you understand what PROC2030 actually requires. How did you make that demonstration without making Priya feel embarrassed?", "05": "Significance wanted the funding gap presentation to be the one the DPM cited later as how it should be done. What made it distinctive?", "06": "Your Significance wanted the feedback conversation to be remembered as the moment Maria built real trust with Pat. How did you use the OIR model to make the conversation feel significant, not transactional?", "07": "Significance wanted Col. Ashford to come away from that call thinking 'this PM has it handled.' How did you project that confidence while being honest about what you didn't yet know?", "08": "Your Significance wants the Risk Register to be the best one in the portfolio. What did you put in Marcus's entry that elevated it above the standard?", "09": "Significance wanted the meeting recovery to be visibly skillful \u2014 a demonstration of facilitation under pressure. What technique did you choose, and how did you execute it in a way that the room noticed?", "10": "Your Significance wanted to handle the change management situation in a way that would be cited as the right call. How did you document and communicate the decision?", "11": "Significance captured the chiller opportunity in a way that was visible \u2014 a demonstrable win for the project. How did you communicate it upward, and how did you make sure the right people knew about it?", "12": "Your Significance wanted the decline to Raj to be handled with visible grace \u2014 in a way that preserved your standing in the relationship. How did the AER structure help you do that?", "13": "Significance wants the AAR to be remembered \u2014 not just filed. What did Maria do in CF13 that would make participants remember this particular closeout as the standard they held future projects to?"}, "Woo": {"01": "Woo walked into Maria's project and immediately started building relationships \u2014 meeting the PDT, learning names, making connections. How did that energy serve the first-week priorities \u2014 and where did it risk substituting relationship-building for the harder work?", "02": "Your Woo wanted both PDT members to feel heard and validated \u2014 which is useful, but can also defer the decision. How did you honor both positions without avoiding the resolution?", "03": "Woo would have opened the sponsor conversation warmly and built rapport before naming the gap. Did that approach make the gap easier or harder to surface \u2014 and at what point did you name it directly?", "04": "Your Woo found a way to ask about the HVAC duration that felt collaborative rather than challenging. What was the relational move that made Priya open to the conversation?", "05": "Woo can soften bad news in ways that reduce its impact. How did you make sure the $2.3M gap landed with appropriate weight \u2014 that the DPM understood the seriousness \u2014 while still maintaining the relationship?", "06": "Your Woo made Pat feel comfortable enough to disclose the workload conflict \u2014 that's exactly what the situation needed. What did you do or say that opened that door?", "07": "Woo can smooth over a variance conversation in ways that reduce accountability. How did you make sure your three-sentence narrative was honest and direct, not just reassuring?", "08": "Your Woo turned the risk capture into a collaborative conversation with Marcus \u2014 'help me put that on the Register.' That's Woo doing exactly what the two-minute capture needs. How did Marcus respond?", "09": "Woo recovered the meeting relationally \u2014 'I love that you brought that up, let's park it so we can get to the decisions.' How did the room respond to that energy \u2014 and did it actually recover the time?", "10": "Your Woo wanted to keep the contractor relationship warm even while enforcing the change process. How did you communicate the requirement without creating adversarial energy?", "11": "Woo celebrated the chiller opportunity with visible enthusiasm. Did that enthusiasm create alignment \u2014 or did it move the room to action before the pre-action check was complete?", "12": "Your Woo made the decline feel like a warmth rather than a rejection. How did the AER framework give structure to what Woo does naturally?", "13": "Woo opened the AAR with energy and made people feel safe enough to participate. What did that opening look like \u2014 and how did you transition from warm opening to honest examination?"}, "Adaptability": {"01": "Adaptability is comfortable with ambiguity \u2014 which is an asset in Maria's situation. How did your comfort with not having all the answers shape your first-week approach?", "02": "Your Adaptability found the scope-schedule conflict less distressing than others at your table might have \u2014 you're comfortable holding two competing truths. How did that equanimity help, and where did it need to be paired with a decision?", "03": "Adaptability would have pivoted quickly when the scope gap emerged \u2014 'okay, here's where we are, here's what we do next.' How did that responsiveness serve the situation?", "04": "Your Adaptability found the schedule conversation less threatening because you didn't need it to be perfect \u2014 you needed it to be honest. How did that orientation affect the conversation with Priya?", "05": "Adaptability is comfortable presenting options without knowing which one will be chosen. Did that comfort with uncertainty make the funding gap presentation easier \u2014 or did you feel pressure to land on a recommendation?", "06": "Your Adaptability pivoted immediately when Pat's disclosure changed the conversation. That pivot is Adaptability's natural move. What did you do in the first 10 seconds after Pat said it?", "07": "Adaptability is comfortable with 'I don't have the data yet, let me check' \u2014 because you're not threatened by incompleteness. How did that comfort affect how you responded to Col. Ashford?", "08": "Your Adaptability responded to Marcus's comment in the moment, without needing to plan the conversation in advance. That real-time responsiveness is the two-minute capture at its best. What did you say first?", "09": "Adaptability recovered the meeting fluidly \u2014 without needing to announce the recovery or make it feel like a correction. What did that look like from the outside?", "10": "Your Adaptability is comfortable with the gray zone in CF10 \u2014 you're not threatened by ambiguity. But the situation required a clear decision about process. How did you move from comfort with uncertainty to a clear call?", "11": "Adaptability responded to the chiller opportunity in real time, without needing to deliberate. Did the pre-action check feel like slowing down a natural response \u2014 or like the right pause before acting?", "12": "Your Adaptability responded to Raj's request in the moment without agonizing. What was your immediate response \u2014 and was it the right one after reflection?", "13": "Adaptability is comfortable with an AAR that goes in unexpected directions \u2014 you don't need it to follow the four questions exactly. Did that flexibility serve the conversation, or did it cost the structure?"}, "Connectedness": {"01": "Connectedness sees the charter gap as more than a documentation problem \u2014 it's a signal that this team doesn't have a shared understanding of who owns what. How did you address the relationship beneath the paperwork?", "02": "Your Connectedness saw the scope-schedule conflict as two people who both cared about the project but were talking past each other. How did you help them see the shared commitment beneath the disagreement?", "03": "Connectedness felt the impact of the scope gap on the military family \u2014 this wasn't just a documentation problem, it was a home that didn't match someone's expectation. How did that human dimension shape your response?", "04": "Your Connectedness understood that Priya's schedule wasn't just a document \u2014 it was her professional judgment, her work. How did you challenge the duration in a way that honored the person behind it?", "05": "Connectedness sees the funding gap as a consequence that will affect real people \u2014 the project team, the sponsor, the end user. How did that perspective shape the options you presented to the DPM?", "06": "Your Connectedness saw Pat as a person with a real problem, not an employee with a performance issue. That reframe changed everything. How did you act on it?", "07": "Connectedness understood that Col. Ashford's call wasn't just about data \u2014 it was about whether she could trust Maria to be straight with her. How did you honor that trust dynamic in your response?", "08": "Your Connectedness heard Marcus's comment as something more than risk information \u2014 it was a sign that Marcus trusted you enough to mention it. How did you honor that trust in how you handled the two-minute capture?", "09": "Connectedness felt the relational cost of the parking lot \u2014 the person whose item was parked needed to feel heard, not filed. How did you ensure that?", "10": "Your Connectedness understood that the contractor's substitution request came from a real supply chain problem, not bad faith. How did you hold both the process requirement and the human context?", "11": "Connectedness saw the chiller opportunity as connected to a longer chain \u2014 the crew's current commitment, the project schedule, the sponsor's expectations. How did that systemic view shape your pre-action check?", "12": "Your Connectedness felt Raj's request as a relational investment, not just a task request. How did you decline in a way that honored the relationship he was trying to build?", "13": "Connectedness made the AAR feel important \u2014 because you understood that the lessons from this project would travel with the people who learned them. How did that sense of continuity shape what you asked and what you captured?"}, "Developer": {"01": "Developer saw Maria's first week as an opportunity to help the PDT grow \u2014 not just to fix the charter. What did you observe about the team's capability gaps, and how did you address them without making it feel like criticism?", "02": "Your Developer wanted both PDT members to come out of the scope-schedule conflict with a better understanding of how to navigate it next time. What did you give them \u2014 explicitly or implicitly \u2014 that they could use again?", "03": "Developer saw the WBS gap as a coaching opportunity for whoever let it slip. Who needed to grow from this situation \u2014 and how did you create that growth without assigning blame?", "04": "Your Developer coached Priya through the basis-of-estimate conversation in a way that built her capability, not just corrected her output. What did you teach her \u2014 and will she make the same mistake again?", "05": "Developer saw the funding gap as an opportunity to help the team understand the three-option framework \u2014 not just to present it to the DPM. Who on the team learned something from how you handled CF05?", "06": "Your Developer turned the Pat conversation into a development moment. What did Pat leave the conversation knowing or being able to do that they couldn't before?", "07": "Developer coached the scheduler on variance narrative after the Ashford call \u2014 because the three-sentence structure is a learnable skill. Did you take that coaching opportunity?", "08": "Your Developer turned the Marcus risk capture into a teachable moment. What did Marcus learn about the Register from that conversation that he'll carry forward?", "09": "Developer coached the PDT on agenda design after the meeting \u2014 because the derailment was a symptom of a skill gap, not a one-time failure. What was the one thing you helped them understand?", "10": "Your Developer explained the change management process to the contractor in a way that built their understanding for next time. How did you frame it as shared knowledge rather than enforcement?", "11": "Developer used the pre-action check as a teaching moment for the PDT \u2014 narrating the three questions out loud so others could learn the pattern. Did that narration change how they approached the decision?", "12": "Your Developer saw Raj's request as a signal that Raj needed to understand how to request support more effectively. What did you give him \u2014 explicitly or implicitly \u2014 that would help him next time?", "13": "Developer made the AAR a learning experience for the whole team \u2014 not just a documentation exercise. What growth did you see in the room during the four questions?"}, "Empathy": {"01": "Empathy felt the weight of what Maria was carrying \u2014 a new assignment, an unfamiliar team, a 10-day deadline. How did that awareness shape your first-week priorities \u2014 and where did it risk delaying the hard actions?", "02": "Your Empathy felt both PDT members' frustration simultaneously \u2014 you understood why each one was defending their position. How did that dual awareness help you facilitate \u2014 and where did it make the decision harder?", "03": "Empathy felt the military family's disappointment before anyone said it out loud. How did that emotional awareness shape how you approached the sponsor conversation?", "04": "Your Empathy felt Priya's defensiveness before she expressed it. What did you do with that awareness \u2014 did you soften the question, or did you name the dynamic directly?", "05": "Empathy felt the DPM's pressure acutely \u2014 the ceiling wasn't their fault, either. How did that awareness shape the way you framed the options?", "06": "Your Empathy read Pat's discomfort before Pat disclosed the workload conflict. What did you see \u2014 and how did you create the space for Pat to say it?", "07": "Empathy heard the concern beneath Col. Ashford's question \u2014 this wasn't just about data, it was about confidence in Maria. How did you address the underlying concern, not just the surface question?", "08": "Your Empathy heard what Marcus wasn't saying \u2014 that the vendor situation worried him more than his casual tone suggested. How did you respond to the feeling beneath the comment?", "09": "Empathy felt the relational cost of the parking lot. How did you ensure the person whose item was parked felt heard \u2014 not dismissed?", "10": "Your Empathy understood the contractor's frustration \u2014 supply chain delays are real, and the substitution made practical sense. How did you hold both the process requirement and the human context of the contractor's situation?", "11": "Empathy felt the crew's situation \u2014 not just their commitment, but what being redirected would mean for them. Did that awareness surface in the pre-action check, or did you hold it separately?", "12": "Your Empathy felt Raj's disappointment before you finished the AER. How did that awareness shape the redirect \u2014 and did it make the decline gentler or more complicated?", "13": "Empathy made the AAR feel safe \u2014 people could see that you understood how they felt about the project. How did that emotional safety affect the honesty of the debrief?"}, "Harmony": {"01": "Harmony wanted the charter situation to be resolved without conflict \u2014 but some conflicts in Maria's first week are necessary. Which one did you have to have, and how did you frame it in a way that preserved relationships?", "02": "Your Harmony felt the scope-schedule disagreement most acutely \u2014 two people in conflict, both right. What was the resolution that honored both without requiring either to lose?", "03": "Harmony wanted to tell the sponsor about the scope gap in a way that didn't feel like an accusation. How did you frame it \u2014 and did the framing affect how seriously the sponsor took the problem?", "04": "Your Harmony found the basis-of-estimate question uncomfortable \u2014 because it implies someone made an error. How did you raise it in a way that felt collaborative rather than critical?", "05": "Harmony wanted to soften the funding gap message \u2014 to reduce the DPM's distress. Where does appropriate sensitivity end and problematic softening begin?", "06": "Your Harmony was relieved when Pat's disclosure explained the performance gap \u2014 because it transformed a conflict into a shared problem. How did you build on that relief to move toward a solution?", "07": "Harmony wanted to reassure Col. Ashford \u2014 to reduce the tension in the call. Where did that instinct serve the relationship, and where did it risk softening the message too much?", "08": "Your Harmony framed the risk capture collaboratively \u2014 'help me put this on the Register' rather than 'I need you to report this.' How did that framing affect Marcus's response?", "09": "Harmony used the parking lot because it felt less confrontational than the time-check. Did that choice serve the meeting \u2014 or did it defer a decision that needed to be made in the room?", "10": "Your Harmony wanted to find a resolution that worked for the contractor AND maintained scope integrity. Was there one \u2014 or did the situation require a decision that one party wouldn't like?", "11": "Harmony ran the pre-action check carefully because Harmony hates surprises \u2014 especially the kind that create conflict. What did the check reveal that would have caused conflict if you'd acted without it?", "12": "Your Harmony made the Raj decline as smooth as possible \u2014 warm, clear, with an alternative. Where did you feel the tension between honoring the relationship and holding the boundary?", "13": "Harmony facilitates AARs that feel safe \u2014 but the most useful AARs name things that are uncomfortable. Where did you push the room into discomfort, and where did you let it stay in comfort?"}, "Includer": {"01": "Includer noticed immediately who was missing from the PDT table \u2014 whose voice wasn't in the charter. Who was left out of Maria's project structure, and what was the cost of that absence?", "02": "Your Includer wanted both PDT members to feel that their position was heard and valued before any decision was made. How did you ensure both voices were fully in the room before the conversation moved to resolution?", "03": "Includer felt the military family's exclusion from the scope conversation \u2014 they were the end user and their expectation wasn't in the room when the designs were approved. How do you fix that process?", "04": "Your Includer wanted Priya to feel like a partner in the schedule correction, not a subject of it. How did you bring her into the solution rather than imposing it?", "05": "Includer made sure the cost engineer was in the room for the DPM conversation \u2014 because this wasn't a PM decision alone, and the people who built the estimate deserved to be part of presenting it. Did you bring them in?", "06": "Your Includer wanted Pat to feel fully included in solving the workload problem \u2014 not just reported on. How did you transfer ownership of the solution to Pat?", "07": "Includer thought about who else needed to know about the variance before Col. Ashford called \u2014 who was left out of the information loop, and how did that gap create the problem?", "08": "Your Includer wanted Marcus to feel like a contributor to the risk Register, not just a source of information. How did you frame the two-minute capture as a shared process?", "09": "Includer made sure everyone whose item was parked knew it was parked \u2014 and when it would be addressed. How did you manage the parking lot in a way that no one felt dropped?", "10": "Your Includer wanted the contractor to feel included in the change process \u2014 not just subjected to it. How did you explain the approval chain in a way that felt collaborative?", "11": "Includer thought about who needed to be in the pre-action check conversation \u2014 not just you, but the people whose work would be affected. Who did you consult before acting on the chiller opportunity?", "12": "Your Includer wanted Raj to feel included in the decision about how his request was handled \u2014 not just told no. How did the AER redirect give Raj a path forward that felt like participation?", "13": "Includer made sure every voice in the AAR was heard \u2014 not just the loudest ones, and not just the leaders. How did you draw out the PDT members who were quieter?"}, "Individualization": {"01": "Individualization read each PDT member differently in CF01 \u2014 you saw what each person needed from Maria in her first week. What did you observe, and how did it shape your approach to each conversation?", "02": "Your Individualization understood that the two PDT members in conflict needed different things from the PM. What did each one need \u2014 and how did you give it to them in the same conversation?", "03": "Individualization read the sponsor's style before the conversation and adjusted accordingly. What did you observe about how this sponsor receives difficult information \u2014 and how did you adapt?", "04": "Your Individualization read Priya before the conversation \u2014 what she cared about, how she'd receive the question. How did that read affect your approach?", "05": "Individualization reads the DPM's decision style \u2014 some want options and will choose, some want a recommendation and will ratify. Which type was this DPM, and how did you adjust your presentation?", "06": "Your Individualization saw Pat as an individual \u2014 not a category of employee. What specific thing about Pat shaped how you handled the OIR conversation?", "07": "Individualization read Col. Ashford's communication style and adjusted the variance narrative accordingly. What did you know about how she receives information \u2014 and how did that shape your three sentences?", "08": "Your Individualization heard something specific in how Marcus mentioned the vendor risk \u2014 not just the content, but the tone, the hesitation, the context. What did you hear?", "09": "Individualization knew which PDT member's item to park first \u2014 the one who could best absorb the redirect. How did that individual read affect your recovery sequence?", "10": "Your Individualization read the contractor as operating in good faith \u2014 a specific individual with a real supply chain problem, not a policy violator. How did that read affect how you communicated the process requirement?", "11": "Individualization assessed the specific crew member before redirecting them \u2014 not just the crew as a resource. What did you know about that individual that shaped your pre-action check?", "12": "Your Individualization knew Raj specifically \u2014 what he cared about, how he'd receive a decline. How did that specific knowledge shape the AER?", "13": "Individualization ran a different AAR for this specific team than you would have for any other team \u2014 because you knew these individuals and what they needed to say and hear. What was different about this AAR?"}, "Positivity": {"01": "Positivity energized the PDT in Maria's first week \u2014 you made the charter cleanup feel like a fresh start rather than a cleanup. How did that energy serve the situation, and where did it risk obscuring the seriousness of the gaps?", "02": "Your Positivity reframed the scope-schedule conflict as two people who both cared deeply about the project. How did that reframe shift the energy in the room \u2014 and did it help move toward resolution?", "03": "Positivity can soften difficult messages in ways that reduce their impact. How did you ensure that the scope gap conversation with the sponsor landed with appropriate weight?", "04": "Your Positivity wanted to keep the conversation with Priya productive and forward-looking. How did you raise the basis-of-estimate concern without letting the energy of the conversation collapse?", "05": "Positivity reframed the $2.3M gap as a solvable problem with three real options. How did that energy affect the DPM's response \u2014 and did it help or risk minimizing the seriousness?", "06": "Your Positivity made Pat feel that the workload disclosure was a turning point, not a problem. How did you energize the conversation after the pivot?", "07": "Positivity can project confidence before the data is there to support it. How did you manage the tone of the Ashford call so that your energy was honest, not just reassuring?", "08": "Your Positivity made the two-minute capture feel collaborative rather than bureaucratic. Marcus felt like he was helping, not reporting. How did that energy affect the quality of the entry?", "09": "Positivity recovered the meeting with energy \u2014 you made the time-check feel like an invitation rather than a correction. How did the room respond to that tone?", "10": "Your Positivity wanted to keep the relationship with the contractor warm even while enforcing the process. How did you maintain that energy without minimizing the seriousness of the change management requirement?", "11": "Positivity celebrated the chiller opportunity with visible enthusiasm. How did that energy build team momentum \u2014 and did it create any pressure to act before the pre-action check was complete?", "12": "Your Positivity turned the decline to Raj into an offer \u2014 'not now, but here's what I can do.' How did that energy change what the decline felt like?", "13": "Positivity made the AAR feel generative rather than retrospective. How did you maintain that forward energy while still dwelling long enough on what went wrong?"}, "Relator": {"01": "Relator wanted to understand the existing PDT relationships before acting \u2014 because you know that how people relate to each other determines what's actually possible. What did you learn in week one that changed your approach?", "02": "Your Relator felt the personal dimension of the scope-schedule conflict \u2014 these were people with professional reputations at stake. How did that awareness shape how you facilitated?", "03": "Relator built trust with the sponsor before delivering the scope gap news. How long did that trust-building take \u2014 and was there enough of it to absorb the difficult conversation?", "04": "Your Relator understood what the basis-of-estimate question meant to Priya personally \u2014 her professional judgment was being questioned. How did that understanding shape how you asked?", "05": "Relator had a relationship with the DPM that made the funding gap conversation more honest. How did that existing trust affect the quality of the dialogue?", "06": "Your Relator had a deeper read on Pat than the performance data suggested \u2014 because you'd been paying attention to the relationship. What did you know about Pat that shaped how you opened the conversation?", "07": "Relator's relationship with Col. Ashford gave you a read on what she actually needed from the call. What did she need \u2014 beyond data \u2014 and how did you provide it?", "08": "Your Relator had built enough trust with Marcus that he felt comfortable mentioning the vendor risk casually. That casual mention is a relational signal. How did you honor it?", "09": "Relator knew which PDT member would be most affected by the parking lot decision \u2014 and made sure to speak to them directly after. How did that individual follow-up affect the relationship?", "10": "Your Relator had a relationship with the contractor that affected how the change conversation went. How did that pre-existing relationship \u2014 positive or complicated \u2014 shape the exchange?", "11": "Relator checked in with the crew member personally before redirecting them \u2014 not just assessed their commitment, but talked to them. How did that relational check affect the decision?", "12": "Your Relator knew Raj well enough to know what the decline would cost. How did that knowledge shape both the AER and the conversation after it?", "13": "Relator's relationships with the PDT members made the AAR safer \u2014 people trusted you enough to say what they actually thought. What did that trust make possible in the debrief?"}, "Analytical": {"01": "Analytical wanted to understand the full charter gap before acting \u2014 what fields were missing, what authority was ambiguous, what assumptions were undocumented. What was your complete gap analysis?", "02": "Your Analytical saw the scope-schedule conflict as a data problem: the scope wasn't specified with enough precision to constrain the schedule, and the schedule wasn't derived from the scope. Where did the data break down?", "03": "Analytical traced the scope gap back to its source \u2014 not just 'the scope wasn't documented' but the specific decision point where the gap was created and the specific step where it should have been caught. What was your root cause analysis?", "04": "Your Analytical verified the HVAC duration against production rates, building layout, and resource availability before raising it. What was your evidence \u2014 and was it sufficient to challenge a baselined schedule?", "05": "Analytical wanted more data before presenting the options. What data was missing from the CF05 analysis \u2014 and how did the incomplete dataset affect the quality of the recommendation?", "06": "Your Analytical heard Pat's workload disclosure and immediately wanted to quantify it \u2014 how many hours, how many projects, how many weeks has this been going on. What data did you gather, and what did it tell you?", "07": "Analytical ran the three-step diagnostic because that's what the data requires: verify first, then identify, then determine root cause. What was your evidence at each step?", "08": "Your Analytical populated the Risk Register with precision \u2014 probability was not 'high' or 'low' but a reasoned assessment based on the vendor's track record. What was your basis for the probability rating?", "09": "Analytical diagnosed the meeting failure in real time: the agenda item types weren't sequenced correctly, the decision item was buried, and the parking lot had no owners. What was your complete diagnosis?", "10": "Your Analytical assessed whether the contractor substitution constituted a change under PROC3010 using the exact definition: a modification to the approved scope, schedule, or cost baseline. What was your analysis?", "11": "Analytical ran the pre-action check systematically: what is committed, what does redirection affect, who needs to know. What was the data output from each question?", "12": "Your Analytical assessed Raj's request against the Eisenhower Matrix criteria: urgency (real or relationship-driven?), importance (project impact?). What was your classification \u2014 and what was the evidence?", "13": "Analytical wanted the AAR to produce specific, evidenced lessons \u2014 not general observations. What data would you use to distinguish a real lesson from a feeling about the project?"}, "Context": {"01": "Context wanted to understand the history of Maria's project before acting \u2014 who made the decisions that created the current situation, and why. What did you learn about the project's past that shaped your first week?", "02": "Your Context looked at the scope-schedule conflict historically \u2014 when did the scope get documented, when did the schedule get built, and was the schedule derived from the scope? What did the timeline reveal?", "03": "Context traced the WBS gap back through the project history \u2014 at what point was the scope statement approved, and at what point did the design diverge from it? What was the sequence of events?", "04": "Your Context wanted to know the history of the schedule \u2014 when was it built, what assumptions were it built on, and has the basis of estimate been questioned before? What did the history tell you?", "05": "Context looked at how the cost estimate evolved \u2014 from initial rough order of magnitude to the current figure. Where did the estimate grow, and did anyone flag the trend? What should have been caught and when?", "06": "Your Context asked how long Pat's workload situation had been building \u2014 was this new, or was this a pattern that had been ignored? What did the history tell you about the organizational conditions that created it?", "07": "Context knew that Col. Ashford had been in this situation before \u2014 receiving bad news about a variance that should have been caught earlier. How did that historical context shape how she was likely to receive the call?", "08": "Your Context asked how long Marcus had known about the vendor's delivery patterns \u2014 was this a recent observation or a longstanding concern? What did the history of the relationship tell you about the risk?", "09": "Context remembered how this PDT's previous meetings had gone \u2014 was derailment a pattern, or was CF09 an outlier? What did the history tell you about the underlying issue?", "10": "Your Context looked at the history of contractor substitutions on similar projects \u2014 was this a one-time situation or a pattern? What did that history tell you about how to handle it?", "11": "Context thought about what happened the last time this crew was redirected \u2014 did it go well, and what were the conditions? How did that history shape your pre-action check?", "12": "Your Context remembered how Raj had handled similar requests in the past \u2014 was this the first time, or a pattern? What did the history of the relationship tell you about the right response?", "13": "Context made the AAR richer \u2014 because you kne
