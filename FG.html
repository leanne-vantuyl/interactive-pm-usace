<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facilitator Guide | Interactive PM in USACE</title>
<style>
:root{
  --bg:#0D1117;--surface:#151C26;--surface2:#1C2535;--border:#2A3550;
  --gold:#C9A44A;--green:#1B6B3A;--navy:#1B3A6B;--red:#8B1A1A;
  --text:#E8E0D0;--muted:#8A9BB5;--dim:#5A6882;
  --tag-init:#1B6B3A;--tag-plan:#1B3A6B;--tag-exec:#6B3A1B;--tag-close:#4A1B6B;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace,monospace;font-size:0.875rem;line-height:1.6;}
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap');

/* ── Header ── */
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.logo-mark{font-size:0.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500;}
.logo-title{font-size:0.75rem;color:var(--text);font-weight:500;margin-top:1px;}
.header-controls{display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;}

/* ── Controls ── */
select,input[type=text]{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font-family:'DM Mono',monospace;font-size:0.6875rem;padding:5px 8px;
  outline:none;cursor:pointer;
}
select:focus,input:focus{border-color:var(--gold);}
label{font-size:0.5625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.ctrl-group{display:flex;flex-direction:column;gap:2px;}

/* ── View toggle ── */
.view-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:0.5625rem;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 10px;cursor:pointer;
}
.view-btn.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:700;}

/* ── Print button ── */
.print-btn{
  background:transparent;border:1px solid var(--dim);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:0.5625rem;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 10px;cursor:pointer;
}
.print-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ── Main layout ── */
main{max-width:1100px;margin:0 auto;padding:1.5rem;}

/* ── CF grid header ── */
.cf-index{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.5rem;
  margin-bottom:1.5rem;
}
.cf-chip{
  border:1px solid var(--border);padding:0.5rem 0.75rem;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;
}
.cf-chip:hover{border-color:var(--gold);}
.cf-chip.active{border-color:var(--gold);background:rgba(201,164,74,.07);}
.cf-chip-num{font-size:0.5625rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
.cf-chip-title{font-size:0.75rem;color:var(--text);}
.phase-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;}

/* ── Phase tags ── */
.phase-tag{
  display:inline-block;font-size:0.5rem;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;font-weight:600;
}
.phase-init{background:var(--tag-init);color:#C8F0D8;}
.phase-plan{background:var(--tag-plan);color:#C8D8F0;}
.phase-exec{background:var(--tag-exec);color:#F0D8C8;}
.phase-close{background:var(--tag-close);color:#E8C8F0;}

/* ── View: By Case File ── */
.cf-section{margin-bottom:2.5rem;}
.cf-header{
  display:flex;align-items:center;gap:0.75rem;padding:0.625rem 0.875rem;
  background:var(--surface);border-left:3px solid var(--gold);margin-bottom:1rem;
}
.cf-header-num{font-size:0.5625rem;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;}
.cf-header-title{font-size:0.875rem;font-weight:500;color:var(--text);}

.prompt-grid{display:flex;flex-direction:column;gap:0.375rem;}
.prompt-row{
  display:grid;grid-template-columns:140px 1fr;gap:0;
  border:1px solid var(--border);
}
.prompt-row:hover{border-color:var(--dim);}
.prompt-theme{
  padding:0.5rem 0.625rem;background:var(--surface2);
  font-size:0.5625rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);font-weight:500;display:flex;align-items:flex-start;
  border-right:1px solid var(--border);
}
.prompt-text{
  padding:0.5rem 0.75rem;font-size:0.75rem;color:var(--text);line-height:1.6;
}

/* ── View: By Theme ── */
.theme-section{margin-bottom:2rem;}
.theme-header{
  padding:0.5rem 0.875rem;background:var(--surface);
  border-left:3px solid var(--navy);margin-bottom:0.75rem;
}
.theme-name{font-size:0.75rem;font-weight:500;color:var(--text);letter-spacing:.05em;text-transform:uppercase;}
.theme-domain{font-size:0.5625rem;color:var(--muted);letter-spacing:.08em;}

.cf-prompt-row{
  display:grid;grid-template-columns:60px 1fr;gap:0;
  border:1px solid var(--border);margin-bottom:0.25rem;
}
.cf-prompt-row:hover{border-color:var(--dim);}
.cf-label{
  padding:0.5rem 0.625rem;background:var(--surface2);
  font-size:0.5625rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:flex-start;justify-content:center;
  border-right:1px solid var(--border);font-weight:600;
}
.cf-prompt-text{padding:0.5rem 0.75rem;font-size:0.75rem;color:var(--text);line-height:1.6;}

/* ── Hidden state ── */
.cf-section.hidden,.theme-section.hidden,.prompt-row.hidden,.cf-prompt-row.hidden{display:none!important;}

/* ── Stats bar ── */
.stats-bar{
  display:flex;gap:1rem;padding:0.5rem 0;margin-bottom:1rem;
  border-bottom:1px solid var(--border);font-size:0.5625rem;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;
}

/* ── Print ── */
@media print{
  .site-header,.cf-index,.stats-bar{display:none!important;}
  body{background:#fff;color:#111;font-size:8pt;}
  .prompt-row,.cf-prompt-row{break-inside:avoid;}
  .cf-section,.theme-section{break-before:auto;}
  .cf-header{background:#f0f0f0;border-left:3px solid #333;}
  .prompt-theme,.cf-label{background:#f5f5f5;color:#333;}
  .theme-header{background:#f5f5f5;}
  .hidden{display:none!important;}
  .phase-tag{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>

<header class="site-header">
  <div>
    <div class="logo-mark">Interactive PM in USACE &middot; PROSPECT 355</div>
    <div class="logo-title">Facilitator Guide &mdash; CliftonStrengths Discussion Prompts</div>
  </div>
  <div class="header-controls">
    <div class="ctrl-group">
      <label for="theme-filter">Filter by theme</label>
      <select id="theme-filter" onchange="applyFilters()">
        <option value="">All themes</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label for="cf-filter">Filter by case file</label>
      <select id="cf-filter" onchange="applyFilters()">
        <option value="">All case files</option>
      </select>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <label>View</label>
      <div style="display:flex;gap:4px;">
        <button class="view-btn active" id="btn-bycf" onclick="setView('bycf')">By Case File</button>
        <button class="view-btn" id="btn-bytheme" onclick="setView('bytheme')">By Theme</button>
      </div>
    </div>
    <button class="print-btn" onclick="window.print()">&#9113; Print</button>
  </div>
</header>

<main id="main">

<!-- CF index chips -->
<div class="cf-index" id="cf-index"></div>

<div class="stats-bar" id="stats-bar"></div>

<!-- View: By Case File -->
<div id="view-bycf"></div>

<!-- View: By Theme -->
<div id="view-bytheme" style="display:none;"></div>

</main>

<script>
// ── Case file metadata ──────────────────────────────────────────────────
const CF_META = [
  {num:'01',title:"New PM, Unclear Roles",phase:"Initiation",slug:"Initiation Phase"},
  {num:'02',title:"The Schedule vs. The Scope",phase:"Initiation",slug:"Initiation → Planning"},
  {num:'03',title:"The New Home",phase:"Planning",slug:"Planning Phase"},
  {num:'04',title:"Built to Slip",phase:"Planning",slug:"Planning Phase"},
  {num:'05',title:"The Number Doesn’t Fit",phase:"Planning",slug:"Planning Phase"},
  {num:'06',title:"The Feedback Nobody Wants to Give",phase:"Planning",slug:"Planning Phase"},
  {num:'07',title:"The Phantom Slip",phase:"Execution",slug:"Execution Phase"},
  {num:'08',title:"The Risk Nobody Tracked",phase:"Execution",slug:"Execution Phase"},
  {num:'09',title:"The Meeting That Got Away",phase:"Execution",slug:"Execution Phase"},
  {num:'10',title:"The Wrong Shade of Gray",phase:"Execution",slug:"Execution Phase"},
  {num:'11',title:"Two Faces of Risk",phase:"Execution",slug:"Execution Phase"},
  {num:'12',title:"The Favor",phase:"Execution",slug:"Execution Phase"},
  {num:'13',title:"Closing Well",phase:"Closeout",slug:"Closeout Phase"}
];

// ── Theme domains (Gallup groupings) ───────────────────────────────────
const THEME_DOMAIN = {
  Achiever:'Executing',Arranger:'Executing',Belief:'Executing',
  Consistency:'Executing',Deliberative:'Executing',Discipline:'Executing',
  Focus:'Executing',Responsibility:'Executing',Restorative:'Executing',
  Activator:'Influencing',Command:'Influencing',Communication:'Influencing',
  Competition:'Influencing',Maximizer:'Influencing','Self-Assurance':'Influencing',
  Significance:'Influencing',Woo:'Influencing',
  Adaptability:'Relationship Building',Connectedness:'Relationship Building',
  Developer:'Relationship Building',Empathy:'Relationship Building',
  Harmony:'Relationship Building',Includer:'Relationship Building',
  Individualization:'Relationship Building',Positivity:'Relationship Building',
  Relator:'Relationship Building',
  Analytical:'Strategic Thinking',Context:'Strategic Thinking',
  Futuristic:'Strategic Thinking',Ideation:'Strategic Thinking',
  Input:'Strategic Thinking',Intellection:'Strategic Thinking',
  Learner:'Strategic Thinking',Strategic:'Strategic Thinking'
};

const DOMAIN_COLOR = {
  'Executing':'#8B6914','Influencing':'#8B1A1A',

};

// ── Phase class helper ──────────────────────────────────────────────────
function phaseClass(p){
  if(p==='Initiation') return 'phase-init';
  if(p==='Planning')   return 'phase-plan';
  if(p==='Execution')  return 'phase-exec';
  if(p==='Closeout')   return 'phase-close';
  return 'phase-plan';
}

// ── SF_PROMPTS data ─────────────────────────────────────────────────────
const SF_PROMPTS = {"Achiever":{"01":"Your Achiever drive means you felt the urgency of Maria’s situation immediately — but urgency without a plan is just anxiety. Which of your three commitments in CF01 moved the project forward, and which one just felt productive?","02":"Achiever pushes you to resolve conflict quickly so the work can continue — but some tensions need to be held, not fixed. Where did you feel the pull to close the scope-schedule disagreement before it was actually resolved?","03":"When the gap between the scope statement and the sponsor’s expectation appeared, your Achiever likely wanted to fix it fast. What would it have cost to slow down and document the gap before acting?","04":"Achiever makes you want to correct the schedule and move on — but the relationship with Priya is part of the work. How did you balance getting the number right with keeping the collaboration intact?","05":"Your Achiever wants a solution and wants it now — but the funding gap requires a structured presentation, not a quick fix. Where did the pressure to produce an answer conflict with the discipline to present options first?","06":"Achiever can make feedback conversations feel like productivity — you want to check the box and move on. What happened to the conversation when Pat’s workload constraint changed what ‘done’ looked like?","07":"Your Achiever felt the pressure of Col. Ashford’s call acutely — because Achiever hates being caught unprepared. What did that pressure do to your diagnostic discipline?","08":"Achiever logs the risk and moves on. The danger is that ‘logged’ feels like ‘handled.’ What did you do with Marcus’s comment after it went on the Register?","09":"Your Achiever wanted the meeting to produce outcomes — and when it started slipping, you felt it physically. Which recovery technique matched your Achiever’s need to finish what was started?","10":"Achiever wants authorization and wants to proceed. Where did the ambiguity in the design standard create friction — and how did your Achiever respond to being stopped mid-stride?","11":"Achiever wants risks resolved, not just watched. Where did the temptation to close out a risk before it was actually resolved show up in your decisions?","12":"Achiever wants to help — and helping a colleague feels productive. Where did that drive to do the work conflict with the discipline to stay inside your lane?","13":"Achiever wants the project to end clean — everything wrapped, nothing dangling. Where did the pressure to close conflict with the discipline to close correctly?"},"Arranger":{"01":"Arranger sees the system — people, tasks, timelines — and immediately starts reconfiguring. When you surveyed Maria’s situation, what did you try to rearrange first, and what did that miss?","02":"Arranger wants to find the configuration where both schedule and scope work. Was there a configuration available here, or were you being asked to choose?","03":"When you discovered the scope-expectation gap, your Arranger likely started sketching workarounds. Which workaround felt elegant but would have created downstream misalignment?","04":"Arranger sees resource and timeline conflicts as puzzles to solve. When Priya’s estimate didn’t match the schedule, did you reconfigure the schedule, the relationship, or both?","05":"Arranger looks for the arrangement that makes the numbers work. What was the arrangement you were most tempted to present — and what were the risks it papered over?","06":"Arranger sees feedback as a system problem: the right people, the right format, the right timing. What was the arrangement you tried to build in CF06, and where did it break down?","07":"Arranger looks at all the pieces — schedule, COE, stakeholders — and starts reconfiguring. Which piece did you rearrange that turned out not to be the actual problem?","08":"Arranger wants a tracking system that actually catches things. When Marcus’s comment came in, what would an Arranger’s ideal risk management configuration have looked like?","09":"Arranger thinks about meeting structure as a design problem. What was the structural change that would have prevented the spiral in CF09?","10":"Arranger wants a decision-making process that doesn’t stall. How would you redesign the design standard approval flow to prevent this situation from recurring?","11":"Arranger sees risk management as a configuration problem. When two risks with opposite resolutions appeared, what was the arrangement you tried to build?","12":"Arranger wants to find the configuration where the favor can be granted without system harm. Was there such a configuration, or did you have to hold the boundary regardless?","13":"Arranger wants closeout to be a clean, efficient handoff. What would your ideal closeout configuration look like — and what in CF13 prevented it?"},"Belief":{"01":"Belief means your commitments aren’t just tactical — they reflect what you think a good PM does. Which of your three decisions in CF01 came from values rather than process?","02":"Belief gives you a sense of what’s right — but scope-schedule conflicts don’t have a morally correct answer. How did your values framework help or hinder your navigation?","03":"When the sponsor’s expectation didn’t match the scope statement, your Belief likely had a view on whose responsibility it was to fix that. What was that view — and was it accurate?","04":"Belief means you have a view on what fairness looks like in a schedule dispute. How did that view shape your approach to Priya’s estimate?","05":"Belief gives you a core sense of what a PM owes a sponsor. When the funding gap appeared, what did your Belief tell you about your obligation — and did doctrine agree?","06":"Belief means feedback isn’t just management technique — it’s an ethical obligation. How did that framing help or complicate the conversation with Pat?","07":"Belief gives you a view on what loyalty to a supervisor looks like. When Col. Ashford called, what did your values say about the right response — and what did doctrine say?","08":"Belief means you take your commitments seriously — including the implicit commitment to track risks you promised to watch. Where did that sense of obligation show up in CF08?","09":"Belief gives you a view on what respect for people’s time looks like. How did that frame your choices when the meeting started spiraling?","10":"Belief means you have a view on what it means to do the job right, even when no one is watching. Where did that value show up when the design standard was ambiguous?","11":"Belief gives you a sense of what a PM owes a risk holder. When two risks pulled in opposite directions, what did your values say about priority?","12":"Belief means you have a view on loyalty. When the favor threatened the project, what did your Belief say about your obligation to your colleague versus the team?","13":"Belief gives you a view on what professional closure looks like. What did your values say about how a PM leaves a project — and how did that show up in CF13?"},"Consistency":{"01":"Consistency wants clear rules applied equally. When Maria’s situation was ambiguous, did you try to establish a consistent standard — or did you make an exception? What were the downstream effects?","02":"Consistency wants a process that applies equally to both scope and schedule pressure. Where did the absence of a consistent change-control process create the problem in CF02?","03":"Consistency wants scope statements to mean what they say. When the expectation gap appeared, your Consistency likely saw it as a process failure. Where did the breakdown happen?","04":"Consistency wants schedule estimates to follow a standard process. When Priya’s number didn’t match, what consistent process would have prevented the dispute?","05":"Consistency wants funding decisions made through a transparent, fair process. What would a consistent, documented approach to the funding gap have looked like?","06":"Consistency wants performance feedback applied equally regardless of tenure or relationship. Where did that standard come under pressure in CF06?","07":"Consistency wants diagnostic discipline: same questions, same sequence, every time. Where did your process break down when the external pressure arrived?","08":"Consistency wants the risk register used the same way for every risk, every time. Where did the informality of Marcus’s comment create an exception to that standard?","09":"Consistency wants meeting management applied equally to all participants and all topics. Where did making an exception — for a valuable tangent, for a senior voice — cost the meeting?","10":"Consistency wants a standard that applies to every contractor, every project, regardless of pressure. When the design standard was ambiguous, what consistent rule would have protected you?","11":"Consistency wants a risk management process that treats every risk the same way. When two risks required opposite actions, what consistent principle resolved the tension?","12":"Consistency wants the boundary applied equally — no exceptions for relationships. How did you hold that standard when the colleague was someone you respected?","13":"Consistency wants closeout performed the same way every time, regardless of fatigue or pressure. Where did the temptation to skip a step appear, and how did you respond?"},"Deliberative":{"01":"Deliberative saw the risks in Maria’s situation that others might have missed. Which risk did you identify that most shaped your three commitments?","02":"Deliberative would have wanted to slow down the scope-schedule conflict before committing to either side. Where did the pressure to decide quickly work against your natural caution?","03":"Deliberative sees the risks in a scope-expectation gap before others do. What risk did you flag — and what risk did you miss because it was harder to see?","04":"Deliberative would have wanted to understand why Priya’s estimate diverged before challenging it. How thoroughly did you diagnose the disagreement before acting?","05":"Deliberative sees the downside of each option before the upside. Which funding option looked most attractive on the surface — and what risk did your Deliberative flag?","06":"Deliberative knows that feedback conversations can go wrong in many ways. What was the risk you were most guarded against in CF06 — and was that the risk that actually appeared?","07":"Deliberative wants to gather more information before committing. When Col. Ashford called, what information did you need that you didn’t have — and how did you handle that gap?","08":"Deliberative sees risk in what’s not being tracked, not just what is. What risk did you notice that wasn’t on the register — and what did you do about it?","09":"Deliberative wants to anticipate meeting failure modes before the meeting starts. What failure mode in CF09 could you have anticipated — and what would preparation have looked like?","10":"Deliberative wants to understand all the implications before acting on ambiguous guidance. What were the implications of proceeding without clarity — and of stopping?","11":"Deliberative sees the risk in the risk treatment, not just the risk itself. What was the risk of acting too quickly on either of the two CF11 risks?","12":"Deliberative knows the favor has consequences you haven’t thought of yet. What downstream consequence did you anticipate that shaped your decision?","13":"Deliberative wants to review the project thoroughly before closing. What would you have done differently at contract closeout if you’d had more time?"},"Discipline":{"01":"Discipline wants a system, not just a list of commitments. How did your three responses in CF01 reflect a systematic approach to onboarding — or did they?","02":"Discipline wants a process for managing scope changes. Where was the breakdown in CF02 — and what systematic fix would prevent it from recurring?","03":"Discipline wants scope management to follow a defined process. What process step was skipped that created the expectation gap in CF03?","04":"Discipline wants schedule development to follow a structured methodology. What methodology failure created the disagreement with Priya?","05":"Discipline wants funding decisions documented and sequenced. What documentation step was missing — and how would it have changed the sponsor’s response?","06":"Discipline wants feedback delivered through a consistent, documented framework. What framework did you use in CF06 — and where did it hold under pressure?","07":"Discipline wants diagnostic checklists, not improvised responses. What was the diagnostic step you skipped — and what did that cost you?","08":"Discipline wants the risk register maintained on a defined schedule with defined criteria. What would a disciplined risk management system have caught in CF08?","09":"Discipline wants a meeting management protocol, not improvised recovery. What protocol element was missing from CF09 that would have prevented the spiral?","10":"Discipline wants a documented authorization trail before proceeding. What documentation step would have protected you in CF10?","11":"Discipline wants risk treatment to follow a structured decision process. What decision framework would have helped you navigate the two competing risks?","12":"Discipline wants scope and resource boundaries maintained systematically. What systematic control would have made the CF12 decision easier?","13":"Discipline wants closeout to follow a defined checklist. What closeout step are you most likely to skip under fatigue — and what does that cost?"},"Focus":{"01":"Focus asks: what is the most important thing here? Of your three commitments in CF01, which one was the actual lever — and did you treat it that way?","02":"Focus wants one clear priority when schedule and scope conflict. What was the actual priority in CF02 — and did the team know it?","03":"Focus asks what the sponsor actually needs versus what the scope statement says. When those diverged, what was the most important thing to fix first?","04":"Focus wants a single question answered before proceeding: is Priya’s estimate a process error or a resource reality? How quickly did you get to that question?","05":"Focus asks what the sponsor actually needs to hear — not all five options, but the one or two that fit the situation. How focused was your presentation in CF05?","06":"Focus wants the feedback conversation to stay on the actual issue. Where did the conversation drift — and what brought it back?","07":"Focus wants one diagnostic priority: what is the actual cause of the slip? How long did it take you to get there?","08":"Focus wants the risk register to surface the highest-priority risks, not just the documented ones. Where did focus help — or hurt — your risk management in CF08?","09":"Focus wants the meeting to accomplish its one most important thing. When time was running out, what was the one item that could not be deferred — and did you protect it?","10":"Focus wants a single question answered before proceeding: is there a clear standard or not? How did you stay focused when the answer was murky?","11":"Focus wants one risk prioritized. When two risks pulled in opposite directions, which one was actually highest priority — and how did you get there?","12":"Focus wants to stay on what actually matters. When the favor request arrived, what was the most important thing you needed to protect?","13":"Focus wants closeout to accomplish one thing: a clean, defensible record. What was the most important closeout task — and did it get the attention it deserved?"},"Responsibility":{"01":"Responsibility means you felt Maria’s situation as your problem to solve, not just your assignment. Where did that ownership help — and where did it make you carry more than was yours to carry?","02":"Responsibility means you felt accountable for both the schedule and the scope, even when the conflict wasn’t your fault. How did that sense of ownership shape your navigation?","03":"When the scope gap appeared, Responsibility likely felt it as a failure that needed immediate correction. How did that drive to make it right serve you — and where did it get ahead of the process?","04":"Responsibility means you felt accountable for Priya’s estimate being wrong, even though it wasn’t your estimate. How did you hold accountability without overreaching?","05":"Responsibility means you feel accountable for the funding gap even if it predates your arrival. How did that ownership serve you in CF05 — and where did it overload you?","06":"Responsibility means you feel accountable for Pat’s performance, not just for the conversation. Where did that sense of ownership help — and where did it make the feedback harder?","07":"Responsibility means you feel accountable for the schedule even when others contributed to the slip. How did that ownership serve your diagnosis — and where did it create blind spots?","08":"Responsibility means you feel accountable for risks you didn’t put on the register. When Marcus flagged something informally, where did your Responsibility lead you?","09":"Responsibility means you feel accountable for the meeting’s outcomes, even when the drift wasn’t your fault. How did that drive to make it right shape your recovery?","10":"Responsibility means you feel accountable for a decision even when the standard is ambiguous. How did that ownership show up — and did it push you to decide before you had enough information?","11":"Responsibility means you feel accountable for all risks, including the ones pulling in opposite directions. How did that ownership help you navigate — and where did it paralyze you?","12":"Responsibility means you feel accountable to both your colleague and your team. When those obligations conflicted, what did your Responsibility say about how to hold both?","13":"Responsibility means you feel accountable for the project record long after close. What would you have done differently in CF13 to leave a cleaner record?"},"Restorative":{"01":"Restorative sees problems as things to fix. When you surveyed Maria’s situation, what was the problem you most wanted to solve — and was that the right starting point?","02":"Restorative wants to fix the scope-schedule conflict — but not every conflict is fixable. Where did the drive to restore equilibrium push you toward a resolution that wasn’t real?","03":"Restorative wants to close the expectation gap. What was the fix — and was it a real fix or a surface repair?","04":"Restorative wants to get the schedule right. When Priya’s estimate diverged, what was your diagnosis of the problem — and how did that shape your approach?","05":"Restorative sees the funding gap as a problem to solve. Which solution felt most satisfying to offer — and what made it less solid than it seemed?","06":"Restorative wants to fix Pat’s performance, not just document it. Where did the drive to restore the relationship conflict with the need to deliver clear feedback?","07":"Restorative wants to diagnose the problem correctly before proposing a fix. Where did you get the diagnosis right — and where did you jump to a fix too fast?","08":"Restorative sees an un-tracked risk as a problem to fix. When Marcus’s comment came in, what was the fix — and what made it harder than expected?","09":"Restorative wants to restore the meeting to its intended purpose. Which recovery technique gave you the cleanest path back?","10":"Restorative wants to solve the ambiguity problem, not just document it. What solution did you offer — and what made it less satisfying than you hoped?","11":"Restorative wants both risks resolved. When they pulled in opposite directions, which one felt more solvable — and was that the one you should have prioritized?","12":"Restorative wants to find a way to help without harming the project. Where did the drive to fix the problem lead you toward a solution that wasn’t really available?","13":"Restorative sees closeout gaps as problems to fix before it’s too late. Which gap did you catch — and which one did you have to accept as past the point of repair?"},"Activator":{"01":"Activator wanted to move on Maria’s situation immediately. Which of your three commitments was driven by the need to act — and which one might have benefited from a beat of diagnosis first?","02":"Activator wants to break the deadlock. When the scope-schedule conflict stalled, what did you do to move it — and what did that action skip?","03":"Activator wanted to close the expectation gap fast. What action did you take that was right — and what action did you take that created a new problem?","04":"Activator wanted to resolve the schedule dispute and move on. Where did the need to act push you past the point of full diagnosis?","05":"Activator wanted to put a solution on the table. Which solution did you lead with — and was it the right one to lead with?","06":"Activator wants to have the conversation now. What happened when you moved before all the context was established?","07":"Activator wanted to give Col. Ashford an answer. What did you say — and what would a beat of pause have changed?","08":"Activator wanted to do something with Marcus’s comment immediately. What was the action you took — and what should the action have been?","09":"Activator wanted to recover the meeting through decisive intervention. Which intervention worked — and which one created more chaos?","10":"Activator wanted a decision and wanted it now. Where did that drive to act conflict with the need to get authorization before proceeding?","11":"Activator wanted to treat the highest-risk threat immediately. Where did that urgency help — and where did it crowd out the opportunity risk?","12":"Activator wanted to help immediately. What was the action you almost took — and what stopped you?","13":"Activator wants closeout finished. Where did the drive to close push you toward cutting corners on documentation or final reviews?"},"Command":{"01":"Command wants to establish authority early. How did your approach to Maria’s situation reflect your Command — and where did establishing authority too quickly create friction?","02":"Command wants a decision made. When the scope-schedule conflict was unresolved, what did your Command want to do — and was that the right move?","03":"When the scope gap appeared, Command wanted to name it clearly and direct a fix. Where did that directness serve the situation — and where did it meet resistance?","04":"Command wants a straight answer from Priya. How did you balance getting the number you needed with the relationship dynamics that made directness complicated?","05":"Command wants to present a recommendation, not a menu of options. Where did that directness serve the sponsor — and where did it get ahead of the analysis?","06":"Command makes feedback feel natural — you can say hard things directly. Where did that directness help the CF06 conversation — and where did it land wrong?","07":"Command wanted to give Col. Ashford a direct, confident answer. What did you say — and in retrospect, was your confidence in proportion to your information?","08":"Command wants the risk register used as a tool, not a formality. When Marcus flagged the issue, Command wanted a direct response. What was it?","09":"Command wanted to take control of the meeting the moment it started drifting. What did you do — and how did it land?","10":"Command wanted a clear ruling on the design standard ambiguity. When no ruling came, what did your Command want to do — and what was the right move?","11":"Command wants one risk prioritized and treated. How did you communicate the priority decision — and how did the team respond?","12":"Command knows how to hold a boundary. When the favor was requested, what did your Command say — and how did you say it in a way that preserved the relationship?","13":"Command wants project close to be declared, not drifted into. What did you do to signal that the project was done — and what did that communicate to the team?"},"Communication":{"01":"Communication wanted to understand Maria’s situation by listening, not just diagnosing. What did you hear in CF01 that shaped your three commitments?","02":"Communication sees the scope-schedule conflict as a communication failure first. Where was the breakdown — and what would a better conversation have looked like?","03":"When the expectation gap appeared, Communication wanted to name it clearly — without blame. What was the conversation you tried to have, and what made it harder than expected?","04":"Communication sees schedule disputes as conversations waiting to happen. What was the conversation with Priya that resolved — or failed to resolve — the number?","05":"Communication wants to present the funding options in a way the sponsor can act on. What made the presentation effective — and what could have been clearer?","06":"Communication sees feedback as a conversation, not a performance evaluation. How did you frame the conversation with Pat — and where did the framing fail?","07":"Communication wanted to give Col. Ashford a clear, honest answer. Where did the pressure to communicate confidence get ahead of the honesty the moment required?","08":"Communication wanted to respond to Marcus in a way that made the risk feel real, not just documented. What did you say — and what would have made it land better?","09":"Communication sees meeting failure as a communication design problem. What communication structure would have prevented the spiral in CF09?","10":"Communication wanted to get clarity on the design standard through a conversation. What was the conversation you tried to have — and what would a better conversation have looked like?","11":"Communication wanted to explain the competing risks in a way the team could act on. How did you frame the tradeoff — and what made it easier or harder to communicate?","12":"Communication sees the favor refusal as a conversation to handle with care. What was the conversation you prepared for — and what made it harder in the moment?","13":"Communication sees project closeout as a story worth telling. What was the narrative of CF13 that you wanted to leave with the team — and did you tell it?"},"Competition":{"01":"Competition wants to get this right — better than others in the same situation would. Which of your CF01 commitments reflected that drive to perform at the top?","02":"Competition wants to solve the scope-schedule conflict more effectively than a mediocre PM would. What was the move that you think separated your approach from an average response?","03":"Competition wants to handle the expectation gap better than it’s usually handled. What was the move that felt differentiated — and what made it harder to execute?","04":"Competition wants to get the schedule right — and get it right faster and cleaner than the situation seemed to allow. Where did that drive to excel show up?","05":"Competition wants to present the funding solution more clearly than a typical PM would. What was the element of your presentation that you think set it apart?","06":"Competition wants to have a better feedback conversation than the average supervisor. What was the move that elevated the conversation — and what could have been sharper?","07":"Competition wants to diagnose the problem correctly when others might panic. What did you do in CF07 that you think reflects strong performance under pressure?","08":"Competition wants a risk management response that’s better than ‘check the box.’ What did you do with Marcus’s comment that you think represents genuine PM competence?","09":"Competition wants to recover a drifting meeting better than a mediocre facilitator would. What was your recovery move — and what made it work?","10":"Competition wants to handle the authorization gap more effectively than a defensive PM would. What was your move — and what do you think separated it from an average response?","11":"Competition wants the best risk management outcome, not just a defensible one. What was the decision in CF11 that you think reflects genuine competence?","12":"Competition wants to hold the boundary in a way that preserves the relationship and the standard. What was the move that required the most skill?","13":"Competition wants to close a project better than the average PM. What do you think you did in CF13 that reflects genuine excellence at closeout?"},"Maximizer":{"01":"Maximizer wants to build on what’s already strong in Maria’s situation, not just fix what’s broken. What strength did you identify — and did you build on it?","02":"Maximizer sees the scope-schedule tension as an opportunity to create a better process, not just resolve this conflict. What improvement did you try to build in?","03":"Maximizer wanted to build on the sponsor’s engagement, not just correct the scope gap. How did you try to convert the problem into a stronger relationship?","04":"Maximizer sees Priya’s pushback as an opportunity to build a better schedule process, not just win the argument. What process improvement came out of CF04?","05":"Maximizer wants the best possible version of the funding presentation. What would have made it stronger — and what got in the way?","06":"Maximizer wants the best version of Pat — not just a corrected one. How did that drive to build on strengths shape the feedback conversation?","07":"Maximizer wants the best possible diagnostic response, not just a defensible one. What would have made your CF07 diagnosis stronger?","08":"Maximizer wants a risk register that surfaces the highest-quality risks. What would a Maximizer’s ideal risk management system look like?","09":"Maximizer wants the best possible version of the meeting, even when it’s already drifting. What would you have done differently to get more out of the time that remained?","10":"Maximizer wants the best possible outcome from an ambiguous situation. What was the highest-quality path forward in CF10 — and how close did you get to it?","11":"Maximizer wants the best possible risk management outcome, not just the minimum viable one. What would have elevated your CF11 response?","12":"Maximizer wants the relationship preserved even when the favor is declined. What was the move that maximized both outcomes?","13":"Maximizer wants the best possible project legacy. What was the element of CF13 closeout that you think will have the most lasting impact?"},"Self-Assurance":{"01":"Self-Assurance meant you trusted your read of Maria’s situation. Where did that confidence serve you — and where did it make you less curious about what you might be missing?","02":"Self-Assurance wanted to trust your judgment in the scope-schedule conflict. Where did that confidence in your read serve you — and where did it get ahead of the data?","03":"Self-Assurance meant you trusted your interpretation of the scope gap. What would it have cost to hold that judgment more lightly?","04":"Self-Assurance trusted your read of Priya’s estimate. Where did that confidence in your judgment serve you — and where did it make collaboration harder?","05":"Self-Assurance trusted your recommendation on the funding options. Where did that confidence serve the sponsor — and where did it crowd out alternatives worth considering?","06":"Self-Assurance meant you trusted your read of Pat’s performance. Where did that confidence serve the conversation — and where did it make you less curious about Pat’s perspective?","07":"Self-Assurance trusted your first diagnostic read. Where did that confidence serve you — and where did it make you less likely to revise as new information arrived?","08":"Self-Assurance trusted your judgment about which risks were worth escalating. Where did that confidence serve you — and where did it create a blind spot?","09":"Self-Assurance trusted your recovery instinct. Which recovery move reflected genuine competence — and which one reflected confidence in excess of the situation?","10":"Self-Assurance trusted your read of the authorization situation. Where did that confidence serve you — and where did it push you past the point where you needed more input?","11":"Self-Assurance trusted your prioritization of the two risks. Where did that confidence in your judgment serve the team — and where did it crowd out input?","12":"Self-Assurance trusted your judgment about the boundary. Where did that confidence make the conversation cleaner — and where did it make it harder to hear the colleague’s perspective?","13":"Self-Assurance trusted your read of when the project was truly done. Where did that confidence serve the closeout — and where did it make you less thorough than the situation required?"},"Significance":{"01":"Significance wants this to matter — not just be competent. Which of your three commitments in CF01 was about doing something significant, and which one was about covering yourself?","02":"Significance wants to resolve the scope-schedule conflict in a way people will remember as the right call. What was the move you were most proud of — and what made it feel significant?","03":"Significance wanted to handle the expectation gap in a way that built your reputation. Where did that drive serve you — and where did it push you toward the visible fix rather than the durable one?","04":"Significance wants the schedule dispute resolved in a way that reflects well. Where did that drive to be seen doing it right shape your approach to Priya?","05":"Significance wants the funding presentation to be remembered as excellent. What made it strong — and what would have made it truly stand out?","06":"Significance wants to be known as a leader who develops people, not just manages them. How did that drive shape the feedback conversation with Pat?","07":"Significance wanted to give Col. Ashford an answer that reflected well. Where did that drive to be seen as capable conflict with the discipline to say ‘I need to look into this’?","08":"Significance wants to be known as a PM who takes risk management seriously. What did you do in CF08 that reflects that standard — and what could have been stronger?","09":"Significance wants to be known as a facilitator who can recover a drifting meeting. What was your recovery move — and how did it land?","10":"Significance wanted to handle the authorization gap in a way that reflected PM maturity. What was the move that felt most defensible — and most professionally credible?","11":"Significance wants the risk management decision to be remembered as the right call. What was the decision you’re most confident in — and what made it hard to hold?","12":"Significance wants to be known as someone who holds standards and preserves relationships. How did you hold both in CF12?","13":"Significance wants the project to be remembered well. What did you do at closeout to shape the narrative of CF13 — and what do you wish you’d done differently?"},"Woo":{"01":"Woo wanted to connect with Maria quickly — to build rapport that made the hard conversations easier. Where did that instinct serve you — and where did it substitute connection for diagnosis?","02":"Woo wanted to find the relational move that resolved the scope-schedule conflict. Where did that instinct serve you — and where did relationship-building get in the way of the structural fix?","03":"Woo wanted to turn the expectation gap into an opportunity to deepen the sponsor relationship. What was the relational move you made — and was it enough?","04":"Woo wanted to defuse the tension with Priya through connection. Where did that work — and where did it substitute rapport for the harder conversation about the number?","05":"Woo wanted to build enough rapport with the sponsor that the funding conversation felt collaborative. Where did that work — and where did it crowd out the analysis?","06":"Woo wanted the feedback conversation to feel like support, not evaluation. Where did that instinct serve Pat — and where did it make the feedback softer than it needed to be?","07":"Woo wanted to give Col. Ashford an answer that maintained the relationship. Where did that drive to manage the relational temperature conflict with the discipline to say what you actually knew?","08":"Woo wanted to respond to Marcus in a way that made him feel heard. What was the relational response — and what was the structural follow-through that it still required?","09":"Woo wanted to redirect the meeting through connection — acknowledging the tangent, naming its value. Where did that instinct work — and where did it extend the drift?","10":"Woo wanted to find the relational path through the authorization ambiguity. Where did that instinct serve you — and where did it substitute rapport for the structural fix?","11":"Woo wanted both risk holders to feel heard. Where did that instinct serve the team — and where did it make the prioritization decision harder?","12":"Woo wanted to decline the favor in a way that preserved the friendship. What was the relational move — and how did you hold the boundary at the same time?","13":"Woo wanted the project to close in a way the team would remember positively. What was the relational element of your closeout — and what made it meaningful?"},"Adaptability":{"01":"Adaptability moves well in ambiguity — and Maria’s situation was nothing but. Which of your three commitments reflected a genuine read of the present moment, and which one was you defaulting to a familiar pattern?","02":"Adaptability is comfortable with the tension between scope and schedule — you don’t need it resolved to function. Where did that comfort serve you — and where did it make you less urgent about reaching a decision?","03":"When the expectation gap appeared, Adaptability moved with the new reality rather than defending the original scope statement. Where did that flexibility serve you — and where did it create ambiguity downstream?","04":"Adaptability moved with Priya’s constraint rather than fighting it. Where did that serve the relationship — and where did it produce a schedule that wasn’t honest?","05":"Adaptability read the room and adapted the presentation to what the sponsor needed in that moment. Where did that serve you — and where did it produce a less rigorous analysis?","06":"Adaptability moved with Pat’s response as the conversation unfolded. Where did that serve the conversation — and where did it let Pat redirect a conversation that needed to stay on course?","07":"Adaptability moved well when the initial diagnosis proved wrong. Where did that flexibility serve you — and where did you give up on a line of inquiry too soon?","08":"Adaptability moved with Marcus’s informal flag and found a way to work with it. Where did that serve the risk management — and where did informality become a problem?","09":"Adaptability read the meeting in real time and adjusted. Which adjustment worked — and which one kept you reactive rather than getting ahead of the drift?","10":"Adaptability moved with the ambiguity rather than demanding clarity first. Where did that serve you — and where did proceeding without authorization create risk?","11":"Adaptability moved with the competing risk picture and found a path. Where did that flexibility serve the team — and where did it make the prioritization feel less decisive than it needed to be?","12":"Adaptability moved with the colleague’s request before landing on a response. Where did that flexibility help the conversation — and where did it make the boundary harder to hold?","13":"Adaptability moved through closeout as conditions changed. Where did that flexibility serve the project — and where did it produce a less disciplined record?"},"Connectedness":{"01":"Connectedness sees each assignment as part of a larger arc — Maria’s situation as one node in the system. Which of your three commitments reflected that larger-picture thinking?","02":"Connectedness sees the scope-schedule conflict as a symptom of a larger misalignment. What was the upstream cause that your Connectedness identified?","03":"When the expectation gap appeared, Connectedness looked for the system-level reason it happened. What was the root cause — and how did that shape your response?","04":"Connectedness sees Priya’s estimate as connected to larger resource and priority systems. What was the system-level context that explained the number?","05":"Connectedness sees the funding gap as connected to decisions made earlier in the project’s life. What was the upstream decision that produced this gap — and how did that shape your options?","06":"Connectedness sees Pat’s performance as connected to the system in which Pat operates. What was the system-level factor that the feedback conversation needed to acknowledge?","07":"Connectedness looked for the system-level cause of the schedule slip. What was the larger pattern that CF07 reflected — and what does it suggest for future projects?","08":"Connectedness sees Marcus’s comment as a signal about a larger system problem, not just one risk. What was the larger pattern — and what would it take to address it?","09":"Connectedness sees meeting failure as a symptom of a larger coordination problem. What was the upstream issue that made CF09’s meeting so vulnerable to drift?","10":"Connectedness sees the design standard ambiguity as connected to a larger organizational pattern. What was the pattern — and what does it suggest about how to protect future projects?","11":"Connectedness sees competing risks as connected to larger system dynamics. What was the system-level tension that produced the two opposing risks in CF11?","12":"Connectedness sees the favor request as connected to the broader team culture and workload system. What was the upstream pressure that produced the request?","13":"Connectedness sees project closeout as connected to the organization’s institutional memory. What did you do in CF13 to contribute to that memory — and what do you wish you’d done?"},"Developer":{"01":"Developer sees Maria’s situation as an opportunity to invest in her growth, not just solve today’s problem. Which of your three commitments built her capacity — and which one just fixed the immediate issue?","02":"Developer sees the scope-schedule conflict as a learning opportunity for the team. What was the lesson — and did the team walk away with it?","03":"Developer saw the expectation gap as a teachable moment. What did you teach — and what did you miss the opportunity to teach?","04":"Developer sees the schedule dispute as a chance to build Priya’s process capability. What was the coaching opportunity in CF04 — and did you take it?","05":"Developer sees the funding gap presentation as a chance to build sponsor capacity for PM realities. What did you try to teach — and how did it land?","06":"Developer sees the feedback conversation as the core developmental investment. What was the developmental frame you brought to the conversation with Pat — and where did it hold under pressure?","07":"Developer sees the diagnostic process as a learning opportunity for everyone involved. What was the lesson CF07 offered the team — and did they get it?","08":"Developer sees risk management as a team capability to build, not just a process to execute. What did you try to build in the team through CF08?","09":"Developer sees meeting management as a skill to develop in the team, not just a problem to solve. What was the capacity-building move in CF09 — and how did the team respond?","10":"Developer sees authorization gaps as opportunities to build organizational process knowledge. What was the lesson — and who did you try to teach?","11":"Developer sees competing risk scenarios as a teaching moment about PM judgment. What was the lesson — and how did you frame it for the team?","12":"Developer sees the favor request as a signal about a gap in the team’s capacity or workload system. What was the developmental response — beyond just saying no?","13":"Developer sees project closeout as an investment in the team’s future performance. What did you try to build in CF13 — and what do you wish you’d done differently?"},"Empathy":{"01":"Empathy read Maria’s emotional reality, not just her situation. What did you sense that the case file didn’t say directly — and how did that shape your three commitments?","02":"Empathy read the emotional temperature of the scope-schedule conflict. What did you sense beneath the surface — and how did that shape your navigation?","03":"When the expectation gap appeared, Empathy read the sponsor’s emotional investment in the original vision. How did that read shape your approach?","04":"Empathy read Priya’s constraint not just as a number but as a signal. What was she communicating beyond the estimate — and how did that shape your response?","05":"Empathy read the sponsor’s emotional state going into the funding conversation. What did you sense — and how did that shape how you framed the options?","06":"Empathy read Pat’s emotional experience of the feedback conversation in real time. What did you sense — and where did you adjust your approach because of it?","07":"Empathy read Col. Ashford’s emotional state beneath the question. What did you sense he actually needed — and how did that shape your response?","08":"Empathy read Marcus’s emotional signal in the informal comment. What was he communicating beyond the risk flag — and how did you respond to it?","09":"Empathy read the meeting’s emotional dynamics as it drifted. What were people actually feeling — and how did that shape your recovery approach?","10":"Empathy read the emotional stakes of the design standard dispute for the contractor and for USACE. What were those stakes — and how did they shape your navigation?","11":"Empathy read the emotional investment of both risk holders. What did each person need to feel heard — and how did you balance that with the prioritization decision?","12":"Empathy read the colleague’s real situation beneath the favor request. What was actually going on — and how did that understanding shape your response?","13":"Empathy read the team’s emotional experience of project end. What did people need at closeout — and what did you do to honor that?"},"Harmony":{"01":"Harmony wanted CF01’s ambiguities resolved in a way everyone could live with. Where did that drive to find consensus help — and where did it produce a compromise that wasn’t actually a resolution?","02":"Harmony wanted a resolution to the scope-schedule conflict that both sides could accept. Where did that drive to find the middle ground serve the project — and where did it produce an answer that satisfied neither?","03":"When the expectation gap appeared, Harmony wanted to close it in a way that didn’t create conflict. Where did that instinct serve the sponsor relationship — and where did it defer the harder conversation?","04":"Harmony wanted Priya to feel heard before the number was challenged. Where did that instinct serve the relationship — and where did it make the conversation take longer than necessary?","05":"Harmony wanted the funding presentation to land without creating anxiety. Where did that drive to minimize conflict shape the presentation — and what did it smooth over that the sponsor needed to hear?","06":"Harmony wanted the feedback conversation to end on a note of agreement. Where did that instinct make the conversation better — and where did it pull you away from the harder truth?","07":"Harmony wanted to give Col. Ashford an answer he could accept without escalating tension. Where did that instinct serve the relationship — and where did it produce a response that was less than fully honest?","08":"Harmony wanted Marcus to feel heard and the team to stay aligned on the risk. Where did that instinct serve the response — and where did it produce a softer action than the risk required?","09":"Harmony wanted the meeting to end without anyone feeling shut down. Where did that instinct help the recovery — and where did it extend the drift?","10":"Harmony wanted the authorization dispute to resolve without creating organizational friction. Where did that instinct serve you — and where did avoiding the conflict make the situation worse?","11":"Harmony wanted both risk holders to feel their concerns were addressed. Where did that instinct help the team — and where did it make the prioritization decision harder to execute?","12":"Harmony wanted to decline the favor in a way that preserved the relationship and minimized discomfort. Where did that instinct serve the conversation — and where did it make the boundary unclear?","13":"Harmony wanted project closeout to feel like a positive ending for everyone. Where did that instinct serve the team — and where did it produce a less rigorous closeout than the project required?"},"Includer":{"01":"Includer wanted to make sure no one on the existing team felt displaced when Maria arrived. Which of your commitments addressed team inclusion — and which one missed that dimension?","02":"Includer wanted to make sure all voices in the scope-schedule dispute were heard before a decision was made. Where did that instinct serve the process — and where did it extend the conflict?","03":"When the expectation gap appeared, Includer wanted to make sure the sponsor felt part of the solution, not blamed for the problem. How did that shape your approach?","04":"Includer wanted Priya to feel like a partner in the schedule development, not an obstacle. Where did that instinct serve the relationship — and where did it make the number harder to challenge?","05":"Includer wanted the funding decision to reflect input from all affected parties. Where did that instinct produce a more robust solution — and where did it complicate the presentation?","06":"Includer wanted Pat to feel like a participant in the feedback conversation, not a subject of it. How did that frame shape the conversation — and where did it hold under pressure?","07":"Includer wanted all voices heard in the diagnostic conversation before a conclusion was reached. Where did that instinct serve the diagnosis — and where did it delay action?","08":"Includer wanted Marcus’s informal flag to be treated as a legitimate contribution, not an administrative burden. How did that instinct shape your response?","09":"Includer wanted every participant’s contribution to feel valued, even when redirecting. Which recovery technique honored that instinct — and which one left someone feeling shut down?","10":"Includer wanted all affected parties involved in the authorization decision. Where did that instinct produce a better outcome — and where did it create delay?","11":"Includer wanted both risk holders to feel heard before a prioritization decision was made. Where did that instinct serve the team — and where did it make the decision harder?","12":"Includer wanted the colleague to feel valued even while declining the favor. What did you do to hold both — and where did it get complicated?","13":"Includer wanted everyone’s contribution to the project acknowledged at closeout. What did you do to honor that — and what did you miss?"},"Individualization":{"01":"Individualization read Maria as a specific person, not a generic new PM. What did you see in her specific situation that shaped your three commitments?","02":"Individualization read the scope-schedule conflict as reflecting the specific needs and constraints of these particular people. What did you see that a generic resolution would have missed?","03":"When the expectation gap appeared, Individualization read the sponsor’s specific investment in the project. What did you see — and how did that shape a response tailored to this sponsor?","04":"Individualization read Priya’s constraint as reflecting her specific situation. What was specific about her context that a generic schedule approach would have missed?","05":"Individualization read the sponsor’s specific decision-making style and tailored the presentation accordingly. What did you adapt — and what made that effective or wanted the schedule dispute to end with both sides feeling good about the outcome. Where did that drive to end positively serve the relationship — and where did it produce a number that wasn’t honest?","05":"Positivity wanted the funding conversation to end with the sponsor feeling optimistic about the options. Where did that instinct serve the presentation — and where did it minimize the difficulty?","06":"Positivity wanted the feedback conversation to end on an encouraging note. Where did that instinct serve Pat — and where did it soften the message past the point of clarity?","07":"Positivity wanted to give Col. Ashford an encouraging update. Where did that instinct serve the relationship — and where did it produce a response that was more confident than the situation warranted?","08":"Positivity wanted to frame Marcus’s risk flag as manageable. Where did that reframe serve the team’s morale — and where did it minimize a risk that required a more urgent response?","09":"Positivity wanted to restore the meeting’s energy after the drift. Which recovery technique matched that instinct — and where did optimism about ‘we can still get there’ make the recovery harder?","10":"Positivity wanted to frame the authorization ambiguity as resolvable. Where did that optimism help — and where did it push you toward a decision before the authorization was actually in hand?","11":"Positivity wanted to frame the competing risks as manageable. Where did that reframe help the team’s response — and where did it minimize the difficulty of the actual prioritization?","12":"Positivity wanted the favor decline to end with the colleague feeling supported. Where did that instinct help — and where did it make the boundary unclear?","13":"Positivity wanted the project to end on a high note. Where did that instinct serve the team’s experience of closeout — and where did it make a less-than-perfect closeout feel complete before it was?"},"Relator":{"01":"Relator works best when the relationship is established. How did the lack of an existing relationship with Maria shape your three commitments — and what would you have done differently if you’d known her longer?","02":"Relator sees the scope-schedule conflict as a trust problem as much as a process problem. What would it have taken to build enough trust that the conflict surfaced earlier?","03":"When the expectation gap appeared, Relator wanted to understand the sponsor’s real concern before proposing a fix. How deeply did you understand what was actually at stake for them?","04":"Relator sees Priya’s estimate as a trust signal. What did her willingness — or reluctance — to revise the number tell you about the relationship?","05":"Relator wanted to understand the sponsor’s real financial constraints before presenting options. How well did you understand their actual situation — and how did that shape the conversation?","06":"Relator sees the feedback conversation as a relationship moment, not just a management moment. How did the depth of your relationship with Pat shape what was possible in CF06?","07":"Relator sees Col. Ashford’s call as a trust moment. What did he actually need — and how did the depth of your relationship shape what you could offer?","08":"Relator sees Marcus’s informal comment as a trust signal about the team’s relationship with the risk management system. What was he communicating — and what does that say about the team culture?","09":"Relator sees meeting failure as a relationship signal. What was the trust dynamic that made the meeting vulnerable to drift?","10":"Relator sees the authorization dispute as a trust problem between USACE and the contractor. What was the relationship dynamic that produced the ambiguity — and what would it take to fix it?","11":"Relator sees competing risk holders as people with real relationships to the outcomes. What did each person actually need — and how did that shape your prioritization?","12":"Relator sees the favor request as a moment in a longer relationship. What does declining tell the colleague about how you see that relationship — and how did you hold both the boundary and the relationship?","13":"Relator sees project closeout as the final chapter of a set of relationships. What did you do to close those relationships well — not just the project?"},"Analytical":{"01":"Analytical wanted to understand the data behind Maria’s situation before committing to a course of action. What data did you have — and what were you missing when you made your three commitments?","02":"Analytical wanted to understand why the scope-schedule conflict existed before proposing a resolution. What was the root cause — and did your analysis produce a durable fix or a surface patch?","03":"When the expectation gap appeared, Analytical wanted to quantify it. What was the size of the gap — and what analysis would have made your response more precise?","04":"Analytical wanted to understand the basis for Priya’s estimate before challenging it. What data did you request — and what did that data tell you?","05":"Analytical wanted to present the funding options with rigorous analysis behind each one. Where did your analysis hold — and where did you present conclusions that the data didn’t fully support?","06":"Analytical wanted specific, documented data about Pat’s performance before having the conversation. What data did you have — and where were the gaps?","07":"Analytical wanted a systematic diagnosis before concluding anything about the schedule slip. What was your diagnostic framework — and where did you skip a step?","08":"Analytical wanted the risk register to be data-driven, with clear likelihood and impact assessments. How well did your CF08 response match that standard?","09":"Analytical wanted to understand the meeting failure pattern before intervening. What was the pattern — and what did it suggest about the structural fix?","10":"Analytical wanted to understand the basis for the design standard ambiguity before acting. W rrect?","05":"Ideation generated multiple approaches to the funding gap. Which idea felt most elegant — and what made it less feasible than it seemed?","06":"Ideation generated multiple ways to frame the feedback conversation. Which framing worked — and which one you set aside might have served Pat better?","07":"Ideation generated multiple hypotheses about the schedule slip. Which hypothesis felt most interesting — and which one turned out to be correct?","08":"Ideation generated multiple ways to respond to Marcus’s informal flag. Which response was most creative — and which one was most defensible?","09":"Ideation generated multiple recovery techniques for the drifting meeting. Which idea was most creative — and which one was most practical?","10":"Ideation generated multiple interpretations of the design standard ambiguity. Which interpretation was most interesting — and which one held up under scrutiny?","11":"Ideation generated multiple ways to frame the competing risk tradeoff. Which frame helped the team see the choice clearly — and which one you set aside might have been more accurate?","12":"Ideation generated multiple ways to respond to the favor. Which response felt most creative — and which one was most defensible?","13":"Ideation generated multiple ways to close the project well. Which approach felt most interesting — and which one you set aside might have served the project’s legacy better?"},"Input":{"01":"Input wanted more information before committing to your three responses. What information did you have — and what were you still gathering when you had to decide?","02":"Input wanted to gather all the relevant data before the scope-schedule conflict hardened. What information did you collect — and what were you still missing?","03":"When the expectation gap appeared, Input wanted to understand the full scope of the divergence before acting. What information did you gather — and where were the gaps?","04":"Input wanted to understand the full basis fo
