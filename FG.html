ng shape what you documented and what you let go?"},"Learner":{"01":"Learner came into Maria’s situation asking: what do I need to understand here? Which of your three commitments reflects the depth of that understanding — and where did you act before the learning was complete?","02":"Learner wanted to understand the scope-schedule conflict thoroughly before resolving it. What did you learn — and what do you wish you’d understood more deeply?","03":"When the expectation gap appeared, Learner wanted to understand the full scope of the divergence before acting. What did you learn — and what surprised you?","04":"Learner wanted to understand Priya’s estimate methodology before challenging it. What did you learn about her process — and how did that change your approach?","05":"Learner wanted to understand the funding structure before presenting options. What did you learn — and what do you wish you’d understood before the conversation?","06":"Learner wanted to understand the full picture of Pat’s performance before having the feedback conversation. What did you learn — and what surprised you?","07":"Learner wanted to understand the full scope of the schedule situation before giving any answer. What did you learn — and what were you still learning when you had to respond?","08":"Learner wanted to understand Marcus’s risk flag thoroughly before acting. What did you learn — and what do you wish you’d understood more deeply?","09":"Learner wanted to understand the meeting failure pattern before intervening. What did you learn about this PDT’s meeting culture — and what surprised you?","10":"Learner wanted to understand the full scope of the design standard ambiguity before making a determination. What did you learn — and what do you wish you’d understood before the decision point?","11":"Learner wanted to understand both risks deeply before prioritizing. What did you learn about each one — and what surprised you?","12":"Learner wanted to understand the full context of the favor request before responding. What did you learn — and how did it change your response?","13":"Learner wanted to understand what the project accomplished and what it didn’t before closing the record. What did you learn — and what do you wish the closeout had captured?"},"Strategic":{"01":"Strategic mapped the full landscape of Maria’s situation and identified the path with the highest leverage. Which of your three commitments was the most strategic — and why?","02":"Strategic looked at the scope-schedule conflict and found the path that preserved the most options. What was the strategic move — and what options did it protect?","03":"Strategic looked at the expectation gap and found the resolution path with the least downstream damage. What was the strategic path — and how did you get there?","04":"Strategic looked at the schedule dispute and identified the path that produced an honest number and preserved the relationship. What was the strategic move — and how did it land?","05":"Strategic looked at the funding options and found the path that maximized the sponsor’s options while protecting the project. What was the strategic recommendation — and what made it the strongest path?","06":"Strategic looked at the feedback conversation and found the approach that was most likely to produce durable behavior change. What was the strategic frame — and how did it hold under pressure?","07":"Strategic looked at the schedule slip and identified the path that addressed root cause, not just symptoms. What was the strategic diagnosis — and how did you get there?","08":"Strategic looked at Marcus’s flag and identified the path that turned an informal comment into a formally managed risk. What was the strategic move — and what made it work?","09":"Strategic looked at the drifting meeting and identified the path with the best chance of recovering the most important outcomes. What was the strategic recovery move — and how did it land?","10":"Strategic looked at the authorization gap and identified the path that protected USACE without creating unnecessary conflict with the contractor. What was the strategic move?","11":"Strategic looked at the competing risks and identified the path that maximized the project’s overall position. What was the strategic prioritization — and what made it the right call?","12":"Strategic looked at the favor request and identified the path that held the boundary while preserving the relationship and the team’s trust. What was the strategic move?","13":"Strategic looked at the closeout and identified the path that left the project with the strongest possible record for future projects. What was the strategic closeout decision — and how did it land?"}};

// ── Build UI ────────────────────────────────────────────────────────────
const THEMES = Object.keys(SF_PROMPTS);
const CFs = CF_META.map(m => m.num);

// Populate selects
const themeFilter = document.getElementById('theme-filter');
const cfFilter = document.getElementById('cf-filter');

THEMES.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t + ' (' + THEME_DOMAIN[t] + ')';
  themeFilter.appendChild(opt);
});

CF_META.forEach(cf => {
  const opt = document.createElement('option');
  opt.value = cf.num; opt.textContent = 'CF' + cf.num + ' — ' + cf.title;
  cfFilter.appendChild(opt);
});

// ── CF index chips ──────────────────────────────────────────────────────
const cfIndex = document.getElementById('cf-index');
CF_META.forEach(cf => {
  const chip = document.createElement('div');
  chip.className = 'cf-chip';
  chip.id = 'chip-' + cf.num;
  chip.onclick = () => { jumpToCF(cf.num); };
  chip.innerHTML = `
    <span class="cf-chip-num">CF ${cf.num}</span>
    <span class="cf-chip-title">${cf.title}</span>
    <span class="phase-tag ${phaseClass(cf.phase)}">${cf.slug}</span>
  `;
  cfIndex.appendChild(chip);
});

// ── Build By Case File view ─────────────────────────────────────────────
const viewByCF = document.getElementById('view-bycf');
CF_META.forEach(cf => {
  const sec = document.createElement('div');
  sec.className = 'cf-section';
  sec.id = 'cf-sec-' + cf.num;

  let rows = '';
  THEMES.forEach(t => {
    const prompt = SF_PROMPTS[t][cf.num] || '';
    rows += `<div class="prompt-row" data-theme="${t}" data-cf="${cf.num}">
      <div class="prompt-theme">${t}</div>
      <div class="prompt-text">${prompt}</div>
    </div>`;
  });

  sec.innerHTML = `
    <div class="cf-header">
      <span class="cf-header-num">CF ${cf.num}</span>
      <span class="cf-header-title">${cf.title}</span>
      <span class="phase-tag ${phaseClass(cf.phase)}" style="margin-left:auto;">${cf.slug}</span>
    </div>
    <div class="prompt-grid">${rows}</div>
  `;
  viewByCF.appendChild(sec);
});

// ── Build By Theme view ─────────────────────────────────────────────────
const viewByTheme = document.getElementById('view-bytheme');
THEMES.forEach(t => {
  const domain = THEME_DOMAIN[t] || '';
  const color = DOMAIN_COLOR[domain] || '#888';
  const sec = document.createElement('div');
  sec.className = 'theme-section';
  sec.id = 'theme-sec-' + t;

  let rows = '';
  CF_META.forEach(cf => {
    const prompt = SF_PROMPTS[t][cf.num] || '';
    rows += `<div class="cf-prompt-row" data-theme="${t}" data-cf="${cf.num}">
      <div class="cf-label">CF ${cf.num}</div>
      <div class="cf-prompt-text">${prompt}</div>
    </div>`;
  });

  sec.innerHTML = `
    <div class="theme-header" style="border-left-color:${color}">
      <div class="theme-name" style="color:${color}">${t}</div>
      <div class="theme-domain">${domain}</div>
    </div>
    ${rows}
  `;
  viewByTheme.appendChild(sec);
});

// ── View switching ──────────────────────────────────────────────────────
let currentView = 'bycf';
function setView(v) {
  currentView = v;
  document.getElementById('view-bycf').style.display = (v === 'bycf') ? '' : 'none';
  document.getElementById('view-bytheme').style.display = (v === 'bytheme') ? '' : 'none';
  document.getElementById('btn-bycf').classList.toggle('active', v === 'bycf');
  document.getElementById('btn-bytheme').classList.toggle('active', v === 'bytheme');
  applyFilters();
}

// ── Filter logic ────────────────────────────────────────────────────────
function applyFilters() {
  const selTheme = themeFilter.value;
  const selCF = cfFilter.value;

  // Count visible
  let visible = 0;

  if (currentView === 'bycf') {
    document.querySelectorAll('.cf-section').forEach(sec => {
      const cfNum = sec.id.replace('cf-sec-','');
      if (selCF && selCF !== cfNum) { sec.classList.add('hidden'); return; }
      sec.classList.remove('hidden');

      let secVisible = 0;
      sec.querySelectorAll('.prompt-row').forEach(row => {
        const match = (!selTheme || row.dataset.theme === selTheme);
        row.classList.toggle('hidden', !match);
        if (match) { secVisible++; visible++; }
      });
      if (secVisible === 0) sec.classList.add('hidden');
    });
  } else {
    document.querySelectorAll('.theme-section').forEach(sec => {
      const t = sec.id.replace('theme-sec-','');
      if (selTheme && selTheme !== t) { sec.classList.add('hidden'); return; }
      sec.classList.remove('hidden');

      let secVisible = 0;
      sec.querySelectorAll('.cf-prompt-row').forEach(row => {
        const match = (!selCF || row.dataset.cf === selCF);
        row.classList.toggle('hidden', !match);
        if (match) { secVisible++; visible++; }
      });
      if (secVisible === 0) sec.classList.add('hidden');
    });
  }

  // Update chip highlights
  document.querySelectorAll('.cf-chip').forEach(chip => {
    const cfNum = chip.id.replace('chip-','');
    chip.classList.toggle('active', selCF === cfNum);
  });

  // Update stats
  updateStats(visible, selTheme, selCF);
}

function updateStats(visible, selTheme, selCF) {
  const bar = document.getElementById('stats-bar');
  const themeLabel = selTheme || `All ${THEMES.length} themes`;
  const cfLabel = selCF ? ('CF' + selCF + ': ' + (CF_META.find(c=>c.num===selCF)||{}).title) : 'All 13 case files';
  bar.textContent = `${visible} prompt${visible!==1?'s':''} | ${themeLabel} | ${cfLabel}`;
}

function jumpToCF(num) {
  cfFilter.value = num;
  if (currentView !== 'bycf') setView('bycf');
  applyFilters();
  const el = document.getElementById('cf-sec-' + num);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Init ────────────────────────────────────────────────────────────────
applyFilters();
</script>
